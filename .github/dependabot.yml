version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /packages/runtime/go
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /services/worker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/terraform/environments/staging
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/terraform/environments/production
    schedule:
      interval: weekly
