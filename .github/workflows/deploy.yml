name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment
        required: true
        type: choice
        options:
          - staging
          - production
      operation:
        description: Provision infrastructure or release the application
        required: true
        type: choice
        options:
          - provision
          - release

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  images:
    name: Build ${{ matrix.name }}
    if: inputs.operation == 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: api
            dockerfile: services/api/Dockerfile
          - name: worker
            dockerfile: services/worker/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  delivery:
    name: ${{ inputs.operation }} ${{ inputs.environment }}
    needs: images
    if: ${{ always() && (inputs.operation == 'provision' || needs.images.result == 'success') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      BASE_ADMIN_CIDRS_JSON: ${{ vars.ADMIN_CIDRS_JSON }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      TF_DIRECTORY: infra/terraform/environments/${{ inputs.environment }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_api_domain: ${{ vars.API_DOMAIN }}
      TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_deployment_ssh_public_key: ${{ vars.DEPLOYMENT_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Restrict SSH to this delivery runner
        run: |
          runner_ipv4=$(curl --fail --silent --show-error --retry 3 https://checkip.amazonaws.com)
          if [[ ! "$runner_ipv4" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "could not determine a valid runner IPv4 address" >&2
            exit 1
          fi
          jq --exit-status \
            'type == "array" and length > 0 and all(.[]; type == "string")' \
            <<<"$BASE_ADMIN_CIDRS_JSON" >/dev/null
          runner_cidr="$runner_ipv4/32"
          admin_cidrs=$(jq --compact-output --arg cidr "$runner_cidr" \
            '. + [$cidr] | unique' <<<"$BASE_ADMIN_CIDRS_JSON")
          {
            printf 'RUNNER_CIDR=%s\n' "$runner_cidr"
            printf 'TF_VAR_admin_cidrs=%s\n' "$admin_cidrs"
          } >> "$GITHUB_ENV"
      - name: Configure remote state
        env:
          BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          install -m 0600 /dev/null "$RUNNER_TEMP/backend.hcl"
          printf '%s\n' "$BACKEND_CONFIG" > "$RUNNER_TEMP/backend.hcl"

          backend_value() {
            local key=$1
            awk -F= -v key="$key" '
              $1 ~ "^[[:space:]]*" key "[[:space:]]*$" {
                value = $2
                sub(/^[[:space:]]*"/, "", value)
                sub(/"[[:space:]]*$/, "", value)
                print value
                exit
              }
            ' "$RUNNER_TEMP/backend.hcl"
          }

          state_bucket=$(backend_value bucket)
          state_region=$(backend_value region)
          state_endpoint=$(backend_value s3)
          if [[ ! "$state_bucket" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "invalid Terraform state bucket" >&2
            exit 1
          fi
          if [[ ! "$state_region" =~ ^[a-z0-9-]+$ ]] ||
            [[ "$state_endpoint" != "https://$state_region.your-objectstorage.com" ]]; then
            echo "invalid Hetzner Object Storage endpoint" >&2
            exit 1
          fi

          aws_s3=(
            aws
            --endpoint-url "$state_endpoint"
            --region "$state_region"
            --no-cli-pager
          )
          existing_bucket=$("${aws_s3[@]}" s3api list-buckets \
            --query "Buckets[?Name=='$state_bucket'].Name | [0]" \
            --output text)
          if [[ "$existing_bucket" == "$state_bucket" ]]; then
            echo "reusing existing private Terraform state bucket"
          else
            "${aws_s3[@]}" s3api create-bucket \
              --bucket "$state_bucket" \
              --acl private \
              --create-bucket-configuration "LocationConstraint=$state_region" \
              >/dev/null
            echo "created private Terraform state bucket"
          fi

          "${aws_s3[@]}" s3api put-bucket-versioning \
            --bucket "$state_bucket" \
            --versioning-configuration Status=Enabled
          versioning_status=$("${aws_s3[@]}" s3api get-bucket-versioning \
            --bucket "$state_bucket" \
            --query Status \
            --output text)
          if [[ "$versioning_status" != "Enabled" ]]; then
            echo "Terraform state bucket versioning is not enabled" >&2
            exit 1
          fi

          terraform -chdir="$TF_DIRECTORY" init \
            -backend-config="$RUNNER_TEMP/backend.hcl"
      - name: Apply infrastructure
        run: terraform -chdir="$TF_DIRECTORY" apply -auto-approve
      - name: Record deployment host
        run: |
          deployment_host=$(terraform -chdir="$TF_DIRECTORY" output -raw deployment_host)
          printf 'DEPLOYMENT_HOST=%s\n' "$deployment_host" >> "$GITHUB_ENV"
          {
            printf '## %s %s\n\n' "$INPUT_OPERATION" "$INPUT_ENVIRONMENT"
            printf -- "- Host to verify: \`%s\`\n" "$deployment_host"
            printf -- "- Temporary runner CIDR: \`%s\`\n" "$RUNNER_CIDR"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_OPERATION: ${{ inputs.operation }}
      - name: Configure SSH
        if: inputs.operation == 'release'
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOYMENT_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "SSH_KNOWN_HOSTS must be verified before release" >&2
            exit 1
          fi
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          install -m 0600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Prepare runtime configuration
        if: inputs.operation == 'release'
        env:
          ADMIN_PASSWORD_HASH_B64: ${{ secrets.ADMIN_PASSWORD_HASH_B64 }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          AUTH_ENCRYPTION_KEY_B64: ${{ secrets.AUTH_ENCRYPTION_KEY_B64 }}
          PRIVACY_ARTIFACT_KEY_B64: ${{ secrets.PRIVACY_ARTIFACT_KEY_B64 }}
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          PADDLE_CATALOG_JSON: ${{ secrets.PADDLE_CATALOG_JSON }}
          PADDLE_ENVIRONMENT: ${{ inputs.environment == 'production' && 'production' || 'sandbox' }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
          RUNTIME_ENV: ${{ secrets.RUNTIME_ENV }}
        run: |
          if [[ -z "$ADMIN_PASSWORD_HASH_B64" ]]; then
            echo "ADMIN_PASSWORD_HASH_B64 must be configured for password authentication" >&2
            exit 1
          fi
          validate_encryption_key() {
            local name=$1
            local value=$2
            local decoded_length
            if [[ ! "$value" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
              echo "$name must be base64 of exactly 32 bytes" >&2
              exit 1
            fi
            decoded_length=$(
              printf '%s' "$value" |
                base64 --decode 2>/dev/null |
                wc -c
            ) || {
              echo "$name must be valid base64" >&2
              exit 1
            }
            if (( decoded_length != 32 )); then
              echo "$name must be base64 of exactly 32 bytes" >&2
              exit 1
            fi
          }
          validate_encryption_key \
            "AUTH_ENCRYPTION_KEY_B64" \
            "$AUTH_ENCRYPTION_KEY_B64"
          validate_encryption_key \
            "PRIVACY_ARTIFACT_KEY_B64" \
            "$PRIVACY_ARTIFACT_KEY_B64"
          install -m 0600 /dev/null "$RUNNER_TEMP/runtime.env"
          printf '%s\n' "$RUNTIME_ENV" > "$RUNNER_TEMP/runtime.env"
          if grep --quiet '^PADDLE_' "$RUNNER_TEMP/runtime.env"; then
            echo "Paddle values must use dedicated GitHub Environment secrets" >&2
            exit 1
          fi

          paddle_values=(
            "$PADDLE_API_KEY"
            "$PADDLE_CATALOG_JSON"
            "$PADDLE_WEBHOOK_SECRET"
          )
          configured_paddle_values=0
          for value in "${paddle_values[@]}"; do
            if [[ -n "$value" ]]; then
              configured_paddle_values=$((configured_paddle_values + 1))
            fi
          done
          if (( configured_paddle_values != 3 )); then
            echo "Paddle runtime configuration is incomplete" >&2
            exit 1
          fi
          if [[ "$PADDLE_ENVIRONMENT" == "sandbox" &&
            "$PADDLE_API_KEY" != pdl_sdbx_apikey_* ]] ||
            [[ "$PADDLE_ENVIRONMENT" == "production" &&
            "$PADDLE_API_KEY" != pdl_live_apikey_* ]]; then
            echo "Paddle API key does not match the delivery environment" >&2
            exit 1
          fi
          paddle_catalog=$(jq --compact-output \
            'if type == "array" and length == 14 then . else error("invalid mapping") end' \
            <<<"$PADDLE_CATALOG_JSON") || {
              echo "PADDLE_CATALOG_JSON is invalid" >&2
              exit 1
            }
          {
            printf 'PADDLE_ENVIRONMENT=%s\n' "$PADDLE_ENVIRONMENT"
            printf 'PADDLE_API_KEY=%s\n' "$PADDLE_API_KEY"
            printf 'PADDLE_WEBHOOK_SECRET=%s\n' "$PADDLE_WEBHOOK_SECRET"
            printf 'PADDLE_CATALOG_JSON=%s\n' "$paddle_catalog"
          } >> "$RUNNER_TEMP/runtime.env"
          {
            printf 'API_DOMAIN=%s\n' "$API_DOMAIN"
            printf 'APP_DOMAIN=%s\n' "$APP_DOMAIN"
            printf 'POSTQRON_ADMIN_BOOTSTRAP_EMAIL=%s\n' 'carlo.zuffetti@apdsoftware.it'
            printf 'POSTQRON_ADMIN_PASSWORD_HASH_B64=%s\n' "$ADMIN_PASSWORD_HASH_B64"
            printf 'POSTQRON_AUTH_ENCRYPTION_KEY_B64=%s\n' "$AUTH_ENCRYPTION_KEY_B64"
            printf 'POSTQRON_PRIVACY_ARTIFACT_KEY_B64=%s\n' "$PRIVACY_ARTIFACT_KEY_B64"
            printf 'WEB_IMAGE=ghcr.io/%s-web:%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'API_IMAGE=ghcr.io/%s-api:%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'WORKER_IMAGE=ghcr.io/%s-worker:%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } >> "$RUNNER_TEMP/runtime.env"
          # shellcheck disable=SC2016
          printf '%s\n' \
            'services:' \
            '  api:' \
            '    environment:' \
            '      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}' \
            '      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:?PADDLE_ENVIRONMENT is required}' \
            '      PADDLE_API_KEY: ${PADDLE_API_KEY:?PADDLE_API_KEY is required}' \
            '      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:?PADDLE_WEBHOOK_SECRET is required}' \
            '      PADDLE_CATALOG_JSON: ${PADDLE_CATALOG_JSON:?PADDLE_CATALOG_JSON is required}' \
            > "$RUNNER_TEMP/compose.override.yaml"
      - name: Wait for cloud-init
        if: inputs.operation == 'release'
        run: |
          for _ in $(seq 1 30); do
            if ssh -o ConnectTimeout=5 postqron@"$DEPLOYMENT_HOST" 'test -d /opt/postqron'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Upload release
        if: inputs.operation == 'release'
        run: |
          scp infra/deploy/compose.yaml infra/deploy/Caddyfile postqron@"$DEPLOYMENT_HOST":/opt/postqron/
          scp "$RUNNER_TEMP/runtime.env" postqron@"$DEPLOYMENT_HOST":/opt/postqron/runtime.env
          scp "$RUNNER_TEMP/compose.override.yaml" postqron@"$DEPLOYMENT_HOST":/opt/postqron/compose.override.yaml
      - name: Pull images and restart
        if: inputs.operation == 'release'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh postqron@"$DEPLOYMENT_HOST" docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ssh postqron@"$DEPLOYMENT_HOST" '
            set -e
            trap "docker logout ghcr.io >/dev/null 2>&1 || true" EXIT
            chmod 0600 /opt/postqron/runtime.env
            cd /opt/postqron
            docker compose --env-file runtime.env pull
          '
          ssh postqron@"$DEPLOYMENT_HOST" sudo systemctl restart postqron.service
      - name: Restore administrative SSH allowlist
        if: always()
        run: |
          if [[ ! -d "$TF_DIRECTORY/.terraform" ]]; then
            exit 0
          fi

          for attempt in $(seq 1 12); do
            if state_resources=$(terraform -chdir="$TF_DIRECTORY" state list 2>/dev/null) &&
              grep --fixed-strings --line-regexp --quiet \
                'module.platform.hcloud_firewall.platform' <<<"$state_resources"; then
              if TF_VAR_admin_cidrs="$BASE_ADMIN_CIDRS_JSON" \
                terraform -chdir="$TF_DIRECTORY" apply -auto-approve \
                  -target=module.platform.hcloud_firewall.platform; then
                exit 0
              fi
            fi

            if [[ "$attempt" -lt 12 ]]; then
              echo "remote state is not consistent yet; retrying SSH allowlist restore ($attempt/12)"
              sleep 10
            fi
          done

          echo "could not restore the administrative SSH allowlist after 12 attempts" >&2
          exit 1
