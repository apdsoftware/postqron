# Postqron — ambiente di sviluppo locale (SPEC §2).
#
# Solo servizi di supporto: l'API Go e i frontend girano fuori da Docker
# (`make dev`). In produzione PostgreSQL sta sulla stessa VPS Hetzner
# dell'API, quindi qui replichiamo versione e configurazione, non la topologia.
#
# Uso: `make db-up` / `make db-down` — vedi README.md § Database locale.

name: postqron

services:
  postgres:
    # PostgreSQL 17, allineata alla produzione sulla VPS Hetzner:
    # è la major pacchettizzata di default in Debian 13 (trixie) e disponibile
    # via repository PGDG, con supporto upstream fino a novembre 2029.
    # Immagine Debian (non Alpine) per avere le stesse collation glibc della
    # VPS: collation diverse tra sviluppo e produzione cambiano l'ordinamento
    # degli indici e rendono i test locali non rappresentativi.
    # La patch release è pinnata: gli aggiornamenti sono un cambio esplicito.
    image: postgres:17.11-bookworm
    container_name: postqron-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postqron}
      POSTGRES_USER: ${POSTGRES_USER:-postqron}
      # Nessun default: senza `.env` il servizio non parte, così non esiste
      # una password implicita da dimenticare in giro.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manca POSTGRES_PASSWORD — copia .env.example in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      # Il motore cron ragiona in UTC e converte per timezone del job (R2):
      # il database non deve mai introdurre un fuso implicito.
      TZ: UTC
      PGTZ: UTC

    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC

    # Host e porta di pubblicazione vengono dalle stesse variabili che l'API usa
    # per comporre il proprio DSN (vedi .env.example): non esiste un secondo
    # posto in cui la porta possa essere scritta e divergere da questo.
    # Il default resta il loopback: il database di sviluppo non va esposto in rete.
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      # `-h 127.0.0.1` forza il controllo sul socket TCP, quello che useranno
      # l'API e le migrazioni: il socket Unix risponde già prima che initdb
      # abbia finito e darebbe un healthy prematuro.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-postqron} -d ${POSTGRES_DB:-postqron}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
    name: postqron-postgres-data
