openapi: 3.1.0
info:
  title: Postqron authentication slice
  version: 0.3.0
paths:
  /api/v1/auth/password/register:
    post:
      summary: Register a password account and issue an email-verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRegistration'
      responses:
        '202':
          description: Verification flow accepted without leaking account existence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [verification_requested]
                properties:
                  verification_requested:
                    const: true
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/password/verify:
    post:
      summary: Consume a one-time email-verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordVerification'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [verified]
                properties:
                  verified:
                    const: true
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/password/verify/resend:
    post:
      summary: Re-issue an email-verification token when the account is still unverified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
      responses:
        '202':
          description: Verification flow accepted without leaking account existence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [verification_requested]
                properties:
                  verification_requested:
                    const: true
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/password/login:
    post:
      summary: Authenticate a verified password account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
      responses:
        '200':
          description: Session cookie created
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authenticated]
                properties:
                  authenticated:
                    const: true
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/csrf:
    get:
      summary: Return the derived CSRF token for the current authenticated session
      description: >-
        Reads the current `__Host-postqron_session` cookie, validates the
        active password or OAuth session, and returns only the session-derived
        CSRF token with cache disabled.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Derived CSRF token for the active session
          headers:
            Cache-Control:
              description: Prevents storage of the derived CSRF token
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFToken'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/password/change:
    post:
      summary: Change the authenticated password and rotate the current session
      description: >-
        Requires recent password authentication and the session-derived CSRF
        token returned by `GET /api/v1/auth/csrf`. Success updates the
        Argon2id hash atomically, revokes every existing account session,
        creates one replacement session, and appends a security event without
        storing or returning password material.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: Password changed and current session rotated
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [changed]
                properties:
                  changed:
                    const: true
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      summary: Revoke the current password session
      description: >-
        Revokes the server-side session before clearing the session cookie.
        Repeating logout after revocation remains safe.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked and session cookie cleared
          headers:
            Set-Cookie:
              description: Expired session cookie
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/authorize:
    post:
      summary: Start a federated login or registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginLogin'
      responses:
        '201':
          description: Authorization request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/callback:
    get:
      summary: Complete providers using query response mode
      parameters:
        - $ref: '#/components/parameters/State'
        - $ref: '#/components/parameters/Code'
        - $ref: '#/components/parameters/ProviderError'
      responses:
        '200':
          $ref: '#/components/responses/Callback'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      summary: Complete providers using form_post response mode
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                state:
                  type: string
                code:
                  type: string
                error:
                  type: string
              required: [state]
      responses:
        '200':
          $ref: '#/components/responses/Callback'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/link:
    post:
      summary: Start explicit provider linking from a recently authenticated session
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider:
                  $ref: '#/components/schemas/Provider'
                return_to:
                  type: string
                  pattern: '^/(?!/)'
      responses:
        '201':
          description: Linking authorization request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/sessions/revoke:
    post:
      summary: Revoke every session for the current account
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Sessions revoked and session cookie cleared
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/providers/{provider}:
    delete:
      summary: Revoke and unlink one identity provider
      security:
        - sessionCookie: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Provider'
      responses:
        '204':
          description: Provider revoked and unlinked
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  headers:
    SessionCookie:
      description: >-
        Secure cookie. The runtime sets only an HttpOnly
        `__Host-postqron_session` cookie; the raw session token is never
        returned in JSON.
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-postqron_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token derived from and bound to the current opaque session, returned by `GET /api/v1/auth/csrf`
      schema:
        type: string
        minLength: 64
        maxLength: 64
    State:
      name: state
      in: query
      required: true
      schema:
        type: string
    Code:
      name: code
      in: query
      schema:
        type: string
    ProviderError:
      name: error
      in: query
      schema:
        type: string
  responses:
    Callback:
      description: Login, registration, or linking completed
      headers:
        Set-Cookie:
          description: Secure session cookie for login and registration
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [account_id, linked, onboarding, return_to]
            properties:
              account_id:
                type: string
              linked:
                type: boolean
              onboarding:
                type: boolean
              return_to:
                type: string
    Error:
      description: Stable, retry-aware error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PasswordRegistration:
      type: object
      additionalProperties: false
      required: [email, password, confirmation, contract_country, consents]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          writeOnly: true
        confirmation:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          writeOnly: true
        contract_country:
          const: IT
        consents:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/ConsentReceipt'
    PasswordVerification:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          writeOnly: true
    CSRFToken:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          minLength: 64
          maxLength: 64
    PasswordLogin:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          writeOnly: true
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password, confirmation]
      properties:
        current_password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          writeOnly: true
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          writeOnly: true
        confirmation:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          writeOnly: true
    Provider:
      type: string
      enum: [google, apple, facebook, linkedin]
    ConsentReceipt:
      type: object
      additionalProperties: false
      required:
        - document_key
        - version
        - digest_sha256
        - action
        - purpose
        - locale
        - surface
        - control_text_id
      properties:
        document_key:
          type: string
        version:
          type: string
          pattern: '^[1-9][0-9]*\.[0-9]+$'
        digest_sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
        action:
          type: string
          enum: [accepted, acknowledged, granted, rejected, withdrawn]
        purpose:
          type: string
        locale:
          const: it-IT
        surface:
          type: string
        control_text_id:
          type: string
    BeginLogin:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
        return_to:
          type: string
          pattern: '^/(?!/)'
        contract_country:
          type: string
          description: Required and limited to IT when a new account is created.
        consents:
          type: array
          description: Required legal receipts when a new account is created.
          items:
            $ref: '#/components/schemas/ConsentReceipt'
    Authorization:
      type: object
      additionalProperties: false
      required: [authorization_url, expires_at]
      properties:
        authorization_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
