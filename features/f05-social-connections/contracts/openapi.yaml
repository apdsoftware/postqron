openapi: 3.1.0
info:
  title: Postqron social connections API
  version: 0.1.0
  description: >
    Owner-controlled Meta authorization, explicit resource selection,
    connection state, reconnection, and revocation. Token material is never
    part of this API.
paths:
  /api/v1/workspaces/{workspace_id}/social-connections/bootstrap:
    get:
      operationId: getSocialConnectionsBootstrap
      summary: List client-safe provider availability
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Availability contains no provider credentials or tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBootstrap"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/{workspace_id}/social-authorizations:
    post:
      operationId: beginSocialAuthorization
      summary: Start an Owner-authorized social OAuth flow
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider:
                  $ref: "#/components/schemas/Provider"
      responses:
        "201":
          description: One-time authorization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/social-authorizations/callback:
    get:
      operationId: completeSocialAuthorization
      summary: Exchange the provider code and return selectable resources
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Safe resource metadata awaiting explicit selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Selection"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/workspaces/{workspace_id}/social-connections:
    get:
      operationId: listSocialConnections
      summary: List safe social connection state
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Connections without credentials
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [connections]
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: selectSocialResource
      summary: Explicitly select one discovered resource to connect or reconnect
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selection_id, remote_id]
              properties:
                selection_id:
                  type: string
                remote_id:
                  type: string
      responses:
        "201":
          description: Resource connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/workspaces/{workspace_id}/social-connections/{connection_id}/reconnect:
    post:
      operationId: reconnectSocialConnection
      summary: Start a new explicit OAuth grant for a disconnected resource
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "201":
          description: One-time reconnect authorization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/workspaces/{workspace_id}/social-connections/{connection_id}:
    delete:
      operationId: revokeSocialConnection
      summary: Revoke locally, delete credentials, and revoke at Meta when safe
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Local connection revoked and credentials deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revocation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-postqron_session
  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthenticated:
      description: An authenticated application session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Owner permission is required for mutations
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderUnavailable:
      description: Provider is fail-closed until configuration and review are ready
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Stable retry-aware domain error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    Provider:
      type: string
      enum: [facebook_pages, instagram_professional]
    ProviderAvailability:
      type: object
      additionalProperties: false
      required: [provider, status, retryable]
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        status:
          type: string
          enum: [available, unavailable]
        retryable:
          type: boolean
    ClientBootstrap:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/ProviderAvailability"
    Authorization:
      type: object
      additionalProperties: false
      required: [authorization_url, expires_at]
      properties:
        authorization_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    Candidate:
      type: object
      additionalProperties: false
      required:
        [remote_id, resource_type, account_type, display_name, scopes]
      properties:
        remote_id:
          type: string
        resource_type:
          type: string
          enum: [facebook_page, instagram_professional]
        account_type:
          type: string
          enum: [page, business, creator]
        display_name:
          type: string
        handle:
          type: string
        picture_url:
          type: string
          format: uri
        scopes:
          type: array
          items:
            type: string
    Selection:
      type: object
      additionalProperties: false
      required: [selection_id, provider, resources, expires_at]
      properties:
        selection_id:
          type: string
        provider:
          $ref: "#/components/schemas/Provider"
        resources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Candidate"
        expires_at:
          type: string
          format: date-time
    Connection:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - provider
        - remote_id
        - resource_type
        - account_type
        - display_name
        - scopes
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        workspace_id:
          type: string
        provider:
          $ref: "#/components/schemas/Provider"
        remote_id:
          type: string
        resource_type:
          type: string
          enum: [facebook_page, instagram_professional]
        account_type:
          type: string
          enum: [page, business, creator]
        display_name:
          type: string
        handle:
          type: string
        picture_url:
          type: string
          format: uri
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [connected, reconnect_required, revoked]
        reconnect_reason:
          type: string
        token_expires_at:
          type: [string, "null"]
          format: date-time
        last_verified_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    Revocation:
      type: object
      additionalProperties: false
      required: [connection, provider_revoked]
      properties:
        connection:
          $ref: "#/components/schemas/Connection"
        provider_revoked:
          type: boolean
