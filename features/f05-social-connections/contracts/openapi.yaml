openapi: 3.1.0
info:
  title: Postqron social connections API
  version: 0.2.0
  description: >
    Provider-agnostic, Owner-controlled authorization, explicit resource
    selection, connection state, reconnection, and revocation. The bootstrap
    contains a versioned capability catalog, while providers without a verified
    adapter remain fail-closed. Token material is never part of this API.
    Browser responses use credentialed CORS for exact origins from
    POSTQRON_AUTH_ALLOWED_ORIGINS; mutation requests require an allowed Origin
    and public OPTIONS operations serve preflight.
paths:
  /api/v1/workspaces/{workspace_id}/social-connections/bootstrap:
    get:
      operationId: getSocialConnectionsBootstrap
      summary: List client-safe provider availability
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Availability contains no provider credentials or tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBootstrap"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    options:
      operationId: preflightSocialConnectionsBootstrap
      summary: Serve public credentialed-CORS preflight
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "204":
          $ref: "#/components/responses/Preflight"
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /api/v1/workspaces/{workspace_id}/social-authorizations:
    post:
      operationId: beginSocialAuthorization
      summary: Start an Owner-authorized social OAuth flow
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider:
                  $ref: "#/components/schemas/Provider"
      responses:
        "201":
          description: One-time authorization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
    options:
      operationId: preflightSocialAuthorization
      summary: Serve public credentialed-CORS preflight
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "204":
          $ref: "#/components/responses/Preflight"
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /api/v1/social-authorizations/callback:
    get:
      operationId: completeSocialAuthorization
      summary: Exchange the provider code and return selectable resources
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Safe resource metadata awaiting explicit selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Selection"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
    options:
      operationId: preflightSocialAuthorizationCallback
      summary: Serve public credentialed-CORS preflight
      security: []
      responses:
        "204":
          $ref: "#/components/responses/Preflight"
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /api/v1/workspaces/{workspace_id}/social-connections:
    get:
      operationId: listSocialConnections
      summary: List safe social connection state
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Connections without credentials
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [connections]
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: selectSocialResource
      summary: Explicitly select one discovered resource to connect or reconnect
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selection_id, remote_id]
              properties:
                selection_id:
                  type: string
                remote_id:
                  type: string
      responses:
        "201":
          description: Resource connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
    options:
      operationId: preflightSocialConnections
      summary: Serve public credentialed-CORS preflight
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "204":
          $ref: "#/components/responses/Preflight"
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /api/v1/workspaces/{workspace_id}/social-connections/{connection_id}/reconnect:
    post:
      operationId: reconnectSocialConnection
      summary: Start a new explicit OAuth grant for a disconnected resource
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "201":
          description: One-time reconnect authorization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
    options:
      operationId: preflightSocialConnectionReconnect
      summary: Serve public credentialed-CORS preflight
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "204":
          $ref: "#/components/responses/Preflight"
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /api/v1/workspaces/{workspace_id}/social-connections/{connection_id}:
    delete:
      operationId: revokeSocialConnection
      summary: Revoke locally, delete credentials, and revoke remotely when safe
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Local connection revoked and credentials deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revocation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Error"
    options:
      operationId: preflightSocialConnection
      summary: Serve public credentialed-CORS preflight
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "204":
          $ref: "#/components/responses/Preflight"
        "403":
          $ref: "#/components/responses/OriginForbidden"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-postqron_session
  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Preflight:
      description: >
        Allowed origin; emits Access-Control-Allow-Origin,
        Access-Control-Allow-Credentials, allowed methods and Content-Type
    OriginForbidden:
      description: Origin is absent, invalid, or not in the exact allowlist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: An authenticated application session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        Owner permission and an exact allowed Origin are required for
        mutations
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderUnavailable:
      description: >
        Provider is fail-closed because configuration, review, runtime audit,
        or an adapter is incomplete
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Stable retry-aware domain error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: >
            Client-safe category. Provider failures use provider_access_denied,
            provider_temporary, provider_resource_unavailable, or
            provider_invalid_response. Availability failures use
            provider_not_configured, provider_review_required,
            provider_audit_required, or provider_unavailable. Raw provider
            diagnostics are not exposed.
        message:
          type: string
        retryable:
          type: boolean
    Provider:
      type: string
      enum:
        - facebook_pages
        - facebook_groups
        - instagram_professional
        - instagram_personal
        - x
        - linkedin
        - pinterest
        - tiktok
        - google_business_profile
        - mastodon
        - youtube
        - threads
        - bluesky
    ProviderAvailability:
      type: object
      additionalProperties: false
      required: [provider, status, configuration_state, retryable]
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        status:
          type: string
          enum: [available, unavailable]
        configuration_state:
          type: string
          enum: [not_configured, review_required, audit_required, ready]
        retryable:
          type: boolean
    AdapterCapabilities:
      type: object
      additionalProperties: false
      required:
        - authorization
        - pkce
        - resource_selection
        - token_refresh
        - remote_revocation
      properties:
        authorization:
          type: boolean
        pkce:
          type: boolean
        resource_selection:
          type: boolean
        token_refresh:
          type: boolean
        remote_revocation:
          type: boolean
    ResourceCapability:
      type: object
      additionalProperties: false
      required: [resource_type, account_types, publishing_modes]
      properties:
        resource_type:
          $ref: "#/components/schemas/ResourceType"
        account_types:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AccountType"
        publishing_modes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [auto, notification]
    ProviderCatalogEntry:
      type: object
      additionalProperties: false
      required:
        - provider
        - status
        - configuration_state
        - retryable
        - resources
        - capabilities
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        status:
          type: string
          enum: [available, unavailable]
        configuration_state:
          type: string
          enum: [not_configured, review_required, audit_required, ready]
        retryable:
          type: boolean
        resources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ResourceCapability"
        capabilities:
          $ref: "#/components/schemas/AdapterCapabilities"
    ClientBootstrap:
      type: object
      additionalProperties: false
      required: [catalog_version, providers, catalog]
      properties:
        catalog_version:
          type: string
          const: "2026-07-30"
        providers:
          description: >
            Compatibility projection for the Meta-only F30 client. New clients
            consume catalog.
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/ProviderAvailability"
        catalog:
          type: array
          minItems: 13
          maxItems: 13
          items:
            $ref: "#/components/schemas/ProviderCatalogEntry"
    ResourceType:
      type: string
      enum:
        - facebook_page
        - facebook_group
        - instagram_professional
        - instagram_personal
        - x_profile
        - linkedin_profile
        - linkedin_page
        - pinterest_board
        - tiktok_profile
        - google_business_profile_location
        - mastodon_account
        - youtube_channel
        - threads_profile
        - bluesky_account
    AccountType:
      type: string
      enum:
        - page
        - group
        - business
        - creator
        - personal
        - profile
        - organization
        - board
        - location
        - channel
    Authorization:
      type: object
      additionalProperties: false
      required: [authorization_url, expires_at]
      properties:
        authorization_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    Candidate:
      type: object
      additionalProperties: false
      required:
        [remote_id, resource_type, account_type, display_name, scopes]
      properties:
        remote_id:
          type: string
        resource_type:
          $ref: "#/components/schemas/ResourceType"
        account_type:
          $ref: "#/components/schemas/AccountType"
        display_name:
          type: string
        handle:
          type: string
        picture_url:
          type: string
          format: uri
        scopes:
          type: array
          items:
            type: string
    Selection:
      type: object
      additionalProperties: false
      required: [selection_id, provider, resources, expires_at]
      properties:
        selection_id:
          type: string
        provider:
          $ref: "#/components/schemas/Provider"
        resources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Candidate"
        expires_at:
          type: string
          format: date-time
    Connection:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - provider
        - remote_id
        - resource_type
        - account_type
        - display_name
        - scopes
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        workspace_id:
          type: string
        provider:
          $ref: "#/components/schemas/Provider"
        remote_id:
          type: string
        resource_type:
          $ref: "#/components/schemas/ResourceType"
        account_type:
          $ref: "#/components/schemas/AccountType"
        display_name:
          type: string
        handle:
          type: string
        picture_url:
          type: string
          format: uri
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [connected, reconnect_required, revoked]
        reconnect_reason:
          type: string
        token_expires_at:
          type: [string, "null"]
          format: date-time
        last_verified_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    Revocation:
      type: object
      additionalProperties: false
      required: [connection, provider_revoked]
      properties:
        connection:
          $ref: "#/components/schemas/Connection"
        provider_revoked:
          type: boolean
