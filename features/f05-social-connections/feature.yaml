schema_version: 1
id: social-connections
kind: api
version: 0.5.0
entrypoint: ./social.go
dependencies:
  - auth
  - workspaces
  - f10-entitlements
migrations:
  - ./migrations/000001_create_social_connections.sql
  - ./migrations/000002_provider_platform.sql
  - ./migrations/000003_dynamic_oauth_dpop.sql
  - ./migrations/000004_linkedin_dms_grants.sql
server:
  routes:
    - path: /workspaces/{workspace_id}/social-connections/bootstrap
      handler: SocialRuntime
      methods: [GET]
      visibility: "private"
    - path: /workspaces/{workspace_id}/social-connections/bootstrap
      handler: SocialRuntime
      methods: [OPTIONS]
      visibility: "public"
    - path: /workspaces/{workspace_id}/social-authorizations
      handler: SocialRuntime
      methods: [POST]
      visibility: "private"
    - path: /workspaces/{workspace_id}/social-authorizations
      handler: SocialRuntime
      methods: [OPTIONS]
      visibility: "public"
    - path: /social-authorizations/callback
      handler: SocialRuntime
      methods: [GET]
      visibility: "public"
    - path: /social-authorizations/callback
      handler: SocialRuntime
      methods: [OPTIONS]
      visibility: "public"
    - path: /workspaces/{workspace_id}/social-connections
      handler: SocialRuntime
      methods: [GET, POST]
      visibility: "private"
    - path: /workspaces/{workspace_id}/social-connections
      handler: SocialRuntime
      methods: [OPTIONS]
      visibility: "public"
    - path: /workspaces/{workspace_id}/social-connections/{connection_id}/reconnect
      handler: SocialRuntime
      methods: [POST]
      visibility: "private"
    - path: /workspaces/{workspace_id}/social-connections/{connection_id}/reconnect
      handler: SocialRuntime
      methods: [OPTIONS]
      visibility: "public"
    - path: /workspaces/{workspace_id}/social-connections/{connection_id}
      handler: SocialRuntime
      methods: [DELETE]
      visibility: "private"
    - path: /workspaces/{workspace_id}/social-connections/{connection_id}
      handler: SocialRuntime
      methods: [OPTIONS]
      visibility: "public"
