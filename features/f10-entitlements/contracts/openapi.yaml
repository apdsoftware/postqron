openapi: 3.1.0
info:
  title: Postqron entitlements API
  version: 0.5.0
paths:
  /api/v1/billing/plans:
    get:
      summary: List the four public plans
      operationId: listPublicPlans
      responses:
        "200":
          description: D09 catalog in EUR with public Unlimited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCatalog"
  /api/v1/workspaces/{workspace_id}/billing:
    get:
      summary: Show the active public plan, usage, and remaining capacity
      operationId: getBillingOverview
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Client-safe entitlement overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "403":
          description: The account is not a workspace member
        "503":
          description: No reliable entitlement is currently available
  /api/v1/workspaces/{workspace_id}/billing/checkout:
    post:
      summary: Start an Owner-only Paddle Checkout
      operationId: createBillingCheckout
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ProCheckoutRequest"
                - $ref: "#/components/schemas/TeamCheckoutRequest"
                - $ref: "#/components/schemas/UnlimitedCheckoutRequest"
      responses:
        "201":
          description: Paddle-hosted Checkout transaction
          content:
            application/json:
              schema:
                type: object
                required: [id, url, expires_at]
                properties:
                  id:
                    type: string
                  url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
        "403":
          description: Only an Owner can manage billing
  /api/v1/workspaces/{workspace_id}/billing/portal:
    post:
      summary: Open the Owner-only Paddle Customer Portal
      operationId: createBillingPortal
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key]
              properties:
                idempotency_key:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        "201":
          description: Temporary, non-cacheable Paddle Customer Portal session
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        "403":
          description: Only an Owner can manage billing
  /api/v1/workspaces/{workspace_id}/billing/subscription/preview:
    post:
      summary: Preview an Owner-only Paddle subscription change
      operationId: previewBillingSubscriptionChange
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ProCheckoutRequest"
                - $ref: "#/components/schemas/TeamCheckoutRequest"
                - $ref: "#/components/schemas/UnlimitedCheckoutRequest"
      responses:
        "200":
          description: Provider preview with the classified change direction
        "403":
          description: Only an Owner can manage billing
  /api/v1/workspaces/{workspace_id}/billing/subscription:
    patch:
      summary: Apply an Owner-only Paddle subscription change
      operationId: applyBillingSubscriptionChange
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ProCheckoutRequest"
                - $ref: "#/components/schemas/TeamCheckoutRequest"
                - $ref: "#/components/schemas/UnlimitedCheckoutRequest"
      responses:
        "204":
          description: Subscription change accepted by Paddle
        "403":
          description: Only an Owner can manage billing
  /api/v1/workspaces/{workspace_id}/billing/subscription/cancel:
    post:
      summary: Cancel an Owner-only Paddle subscription at period end
      operationId: cancelBillingSubscription
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key]
              properties:
                idempotency_key:
                  $ref: "#/components/schemas/IdempotencyKey"
      responses:
        "204":
          description: Cancellation accepted by Paddle
        "403":
          description: Only an Owner can manage billing
  /api/v1/billing/paddle/webhook:
    post:
      summary: Apply a raw-body Paddle webhook with a valid Paddle-Signature
      operationId: applyPaddleWebhook
      responses:
        "204":
          description: Verified event accepted
        "400":
          description: Signature, payload, catalog, or event does not verify
components:
  parameters:
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    PlanCode:
      type: string
      enum: [start, pro, team, unlimited]
    BillingInterval:
      type: string
      enum: [monthly, annual]
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 255
    ProCheckoutRequest:
      type: object
      additionalProperties: false
      required: [plan, interval, channels, idempotency_key]
      properties:
        plan:
          type: string
          const: pro
        interval:
          $ref: "#/components/schemas/BillingInterval"
        channels:
          type: integer
          minimum: 1
          maximum: 6
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
    TeamCheckoutRequest:
      type: object
      additionalProperties: false
      required: [plan, interval, channels, idempotency_key]
      properties:
        plan:
          type: string
          const: team
        interval:
          $ref: "#/components/schemas/BillingInterval"
        channels:
          type: integer
          minimum: 1
          maximum: 9
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
    UnlimitedCheckoutRequest:
      type: object
      additionalProperties: false
      description: >-
        Unlimited is flat-priced. No channel quantity is accepted or
        synthesized for checkout.
      required: [plan, interval, idempotency_key]
      properties:
        plan:
          type: string
          const: unlimited
        interval:
          $ref: "#/components/schemas/BillingInterval"
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
    Money:
      type: object
      required: [amount_cents, currency]
      properties:
        amount_cents:
          type: integer
          format: int64
        currency:
          type: string
          const: EUR
    PublicPlan:
      type: object
      required: [code, name, purchasable, prices, limits]
      properties:
        code:
          $ref: "#/components/schemas/PlanCode"
        name:
          type: string
        purchasable:
          type: boolean
        prices:
          type: object
          required: [monthly, annual]
          properties:
            monthly:
              $ref: "#/components/schemas/Money"
            annual:
              $ref: "#/components/schemas/Money"
        limits:
          type: object
          required:
            - members
            - channels
            - scheduled_publications
            - scheduled_publications_per_channel
          properties:
            members:
              type: [integer, "null"]
              minimum: 1
              description: Null means that no commercial plan quota applies.
            channels:
              type: [integer, "null"]
              minimum: 1
              description: Null means that no commercial plan quota applies.
            scheduled_publications:
              type: [integer, "null"]
              minimum: 1
              description: Null means that no commercial plan quota applies.
            scheduled_publications_per_channel:
              type: [integer, "null"]
              minimum: 1
              description: Null means that no commercial plan quota applies.
        price_tiers:
          type: array
          maxItems: 3
          items:
            type: object
            required: [from_channel, to_channel, monthly, annual]
            properties:
              from_channel:
                type: integer
              to_channel:
                type: integer
              monthly:
                $ref: "#/components/schemas/Money"
              annual:
                $ref: "#/components/schemas/Money"
        trial:
          type: object
          required:
            - days
            - members
            - channels
            - scheduled_publications_per_channel
          properties:
            days:
              type: integer
              const: 14
            members:
              type: integer
              const: 9
            channels:
              type: integer
              const: 9
            scheduled_publications_per_channel:
              type: integer
              const: 500
    PublicCatalog:
      type: object
      required: [provider, catalog_version, currency, plans]
      properties:
        provider:
          type: string
          const: paddle
        catalog_version:
          type: string
          const: d09-v1
        currency:
          type: string
          const: EUR
        plans:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/PublicPlan"
    Usage:
      type: object
      required: [resource, used, limit, remaining, over_limit]
      properties:
        resource:
          type: string
          enum: [members, channels, scheduled_publications]
        used:
          type: integer
          format: int64
        limit:
          type: [integer, "null"]
          format: int64
          description: Null means that no commercial plan quota applies.
        remaining:
          type: [integer, "null"]
          format: int64
          description: Null means that no commercial plan quota applies.
        over_limit:
          type: boolean
    Overview:
      type: object
      required: [plan, interval, state, period, usage]
      properties:
        plan:
          $ref: "#/components/schemas/PublicPlan"
        interval:
          type: string
          enum: [monthly, annual]
        state:
          type: string
          description: >-
            `past_due` remains operational during the 30-day Paddle dunning
            window anchored to the first failed renewal. `payment_restricted`
            is entered only after a verified Paddle paused event following
            prior notice. `canceled` reflects a verified Paddle cancellation
            and exposes the Start plan.
          enum:
            - trialing
            - active
            - past_due
            - trial_expired
            - payment_restricted
            - canceled
        period:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        usage:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/Usage"
