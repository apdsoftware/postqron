schema_version: 1
id: f10-entitlements
kind: api
version: 0.6.0
entrypoints:
  server: ./module.go
dependencies:
  - platform
migrations:
  - ./migrations/000001_create_entitlements.sql
  - ./migrations/000002_paddle_d07.sql
  - ./migrations/000003_paddle_dunning_30_days.sql
  - ./migrations/000004_d09_public_unlimited.sql
  - ./migrations/000005_po_20260727_plan_limits.sql
server:
  routes:
    - path: /billing/plans
      handler: PublicPlans
      methods: [GET]
      visibility: public
    - path: /workspaces/{workspace_id}/billing
      handler: BillingOverview
      methods: [GET]
      visibility: private
    - path: /workspaces/{workspace_id}/billing/checkout
      handler: BillingCheckout
      methods: [POST]
      visibility: private
    - path: /workspaces/{workspace_id}/billing/portal
      handler: BillingPortal
      methods: [POST]
      visibility: private
    - path: /workspaces/{workspace_id}/billing/subscription/preview
      handler: PreviewSubscriptionChange
      methods: [POST]
      visibility: private
    - path: /workspaces/{workspace_id}/billing/subscription
      handler: ApplySubscriptionChange
      methods: [PATCH]
      visibility: private
    - path: /workspaces/{workspace_id}/billing/subscription/cancel
      handler: CancelSubscription
      methods: [POST]
      visibility: private
    - path: /billing/paddle/webhook
      handler: PaddleWebhook
      methods: [POST]
      visibility: public
