openapi: 3.1.0
info:
  title: Postqron app shell façade
  version: 0.1.0
  description: >
    Same-origin server façade used by F30. Every authenticated operation
    validates the F3 HttpOnly session server-side. The façade delegates
    identity, consent, workspace, and transactional email work to F3, F4,
    F13, and F14; it is not an email or OAuth provider client.
paths:
  /api/v1/app/bootstrap:
    get:
      summary: Read safe login configuration, current legal documents, and optional session
      responses:
        "200":
          description: Public bootstrap payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "503":
          $ref: "#/components/responses/RetryableConfigurationError"
  /api/v1/app/session:
    get:
      summary: Resolve the F3 session and current F4 workspace server-side
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Valid server-side session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSession"
        "401":
          description: Missing, expired, revoked, or invalid session
        "403":
          description: Authenticated account cannot access the selected workspace
  /api/v1/app/onboarding:
    post:
      summary: Atomically finish required consent and create or select a workspace
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [consents, workspace]
              properties:
                consents:
                  type: array
                  minItems: 2
                  items:
                    $ref: "#/components/schemas/ConsentReceipt"
                workspace:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [mode, name]
                      properties:
                        mode:
                          const: create
                        name:
                          type: string
                          minLength: 1
                          maxLength: 80
                    - type: object
                      additionalProperties: false
                      required: [mode, id]
                      properties:
                        mode:
                          const: select
                        id:
                          type: string
                          minLength: 1
      responses:
        "200":
          description: Existing workspace selected
        "201":
          description: Personal workspace created
        "401":
          description: Invalid session
        "403":
          description: Workspace membership denied
        "409":
          description: Required consent or workspace state changed
  /api/v1/app/workspaces/select:
    post:
      summary: Select an accessible F4 workspace for the current F3 session
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workspace_id]
              properties:
                workspace_id:
                  type: string
                  minLength: 1
      responses:
        "204":
          description: Selection stored in a secure server-side session
        "401":
          description: Invalid session
        "403":
          description: Account is not an active member
  /api/v1/app/workspaces/current:
    get:
      summary: Read the server-selected current workspace consumed by the Workspace page
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current workspace base data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWorkspace"
        "401":
          description: Invalid session
        "404":
          description: The account has no active workspace memberships
        "503":
          $ref: "#/components/responses/RetryableConfigurationError"
    patch:
      summary: Rename the current workspace as an active Owner
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        "200":
          description: Updated workspace base data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWorkspace"
        "400":
          description: Invalid name or malformed JSON
        "401":
          description: Invalid session
        "403":
          description: The authenticated account is not an active Owner
        "404":
          description: The account has no active workspace memberships
        "409":
          description: Workspace state or concurrent update conflict
        "503":
          $ref: "#/components/responses/RetryableConfigurationError"
  /api/v1/app/workspaces/current/members:
    get:
      summary: List active members of the current workspace
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Active memberships in the selected workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeMember"
        "401":
          description: Invalid session
        "404":
          description: The account has no active workspace memberships
        "503":
          $ref: "#/components/responses/RetryableConfigurationError"
  /api/v1/app/workspaces/current/invitations:
    post:
      summary: Invite a Member to the current workspace as an active Owner
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Existing pending invitation reissued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeInvitation"
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeInvitation"
        "400":
          description: Invalid email or malformed JSON
        "401":
          description: Invalid session
        "403":
          description: The authenticated account is not an active Owner
        "404":
          description: The account has no active workspace memberships
        "409":
          description: Member limit, workspace state, or concurrent update conflict
        "503":
          $ref: "#/components/responses/RetryableConfigurationError"
  /api/v1/app/workspaces/current/members/{memberId}/role:
    put:
      summary: Change an active current-workspace member role as an Owner
      security:
        - sessionCookie: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  enum: [owner, member]
      responses:
        "204":
          description: Role changed or already had the requested value
        "400":
          description: Invalid member or role
        "401":
          description: Invalid session
        "403":
          description: Actor is not an active Owner or target is not active
        "404":
          description: The account has no active workspace memberships
        "409":
          description: Final Owner or concurrent update conflict
        "503":
          $ref: "#/components/responses/RetryableConfigurationError"
  /api/v1/app/workspaces/current/members/{memberId}:
    delete:
      summary: Remove an active current-workspace member as an Owner
      security:
        - sessionCookie: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: Active membership removed
        "400":
          description: Invalid member identifier
        "401":
          description: Invalid session
        "403":
          description: Actor is not an active Owner or target is not active
        "404":
          description: The account has no active workspace memberships
        "409":
          description: Final Owner or concurrent update conflict
        "503":
          $ref: "#/components/responses/RetryableConfigurationError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-postqron_session
  responses:
    RetryableConfigurationError:
      description: Safe retryable error; no secret or provider response is exposed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppError"
  schemas:
    AppError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
    ConsentReceipt:
      type: object
      additionalProperties: false
      required: [document_key, version, digest_sha256, action, locale]
      properties:
        document_key:
          enum: [terms, privacy]
        version:
          type: string
          minLength: 1
        digest_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        action:
          const: accepted
        locale:
          enum: [en, it, es, fr, de]
    LegalDocument:
      type: object
      additionalProperties: false
      required: [key, version, digest_sha256, href]
      properties:
        key:
          enum: [terms, privacy]
        version:
          type: string
        digest_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        href:
          type: string
          pattern: "^/(?:en|it|es|fr|de)?/?legal/"
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          enum: [owner, member]
    RuntimeWorkspace:
      type: object
      additionalProperties: false
      required: [id, name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          enum: [owner, member]
        status:
          enum: [active, deletion_pending]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RuntimeMember:
      type: object
      additionalProperties: false
      required: [id, account_id, email, role, status, created_at, updated_at]
      properties:
        id:
          type: string
        account_id:
          type: string
        email:
          type: string
          format: email
        role:
          enum: [owner, member]
        status:
          const: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RuntimeInvitation:
      type: object
      additionalProperties: false
      required: [id, status, expires_at, reissued]
      properties:
        id:
          type: string
        status:
          const: pending
        expires_at:
          type: string
          format: date-time
        token:
          type: string
          minLength: 32
          writeOnly: true
        reissued:
          type: boolean
    AppSession:
      type: object
      additionalProperties: false
      required: [account, onboarding_required, workspaces]
      properties:
        account:
          type: object
          additionalProperties: false
          required: [id, display_name, locale]
          properties:
            id:
              type: string
            display_name:
              type: string
            email:
              type: string
              format: email
            locale:
              enum: [en, it, es, fr, de]
        onboarding_required:
          type: boolean
        current_workspace:
          $ref: "#/components/schemas/Workspace"
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    Bootstrap:
      type: object
      additionalProperties: false
      required: [auth_methods, providers, legal_documents]
      properties:
        auth_methods:
          type: array
          minItems: 1
          maxItems: 1
          items:
            const: password
        providers:
          type: array
          items:
            enum: [google, apple, facebook, linkedin]
        legal_documents:
          type: array
          minItems: 0
          maxItems: 2
          items:
            $ref: "#/components/schemas/LegalDocument"
        session:
          $ref: "#/components/schemas/AppSession"
