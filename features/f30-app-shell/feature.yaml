schema_version: 1
id: app-shell
kind: web
version: 0.1.0
entrypoints:
  server: ./module.go
  web: ./runtime.ts
dependencies:
  - auth
  - account-privacy
  - brand
  - compliance
  - email
  - f10-entitlements
  - i18n
  - social-connections
  - workspaces
migrations: []
server:
  routes:
    - path: /app/bootstrap
      handler: App
      methods: [GET]
      visibility: "public"
    - path: /app/bootstrap
      handler: App
      methods: [OPTIONS]
      visibility: "public"
    - path: /app/session
      handler: App
      methods: [GET]
      visibility: "public"
    - path: /app/session
      handler: App
      methods: [OPTIONS]
      visibility: "public"
web:
  routes:
    - name: app-entry
      path: /app
      file: ./pages/app.vue
      visibility: public
      middleware: []
    - name: app-verify-email
      path: /app/verify-email
      file: ./pages/verify-email.vue
      visibility: public
      middleware: []
    - name: app-oauth-callback
      path: /app/oauth/callback
      file: ./pages/oauth-callback.vue
      visibility: public
      middleware: []
    - name: app-onboarding
      path: /app/onboarding
      file: ./pages/onboarding.vue
      visibility: private
      middleware: [app-session]
    - name: app-home
      path: /app/home
      file: ./pages/home.vue
      visibility: private
      middleware: [app-session]
    - name: app-profile
      path: /app/profile
      file: ./pages/profile.vue
      visibility: private
      middleware: [app-session]
    - name: app-security
      path: /app/security
      file: ./pages/security.vue
      visibility: private
      middleware: [app-session]
    - name: app-providers-legacy-redirect
      path: /app/providers
      file: ./pages/providers-redirect.vue
      visibility: private
      middleware: [app-session]
    - name: app-social-channels
      path: /app/social-channels
      file: ./pages/social-channels.vue
      visibility: private
      middleware: [app-session]
    - name: app-plan
      path: /app/plan
      file: ./pages/plan.vue
      visibility: private
      middleware: [app-session]
    - name: app-workspace
      path: /app/workspace
      file: ./pages/workspace.vue
      visibility: private
      middleware: [app-session]
    - name: app-privacy
      path: /app/privacy
      file: ./pages/privacy.vue
      visibility: private
      middleware: [app-session]
    - name: app-account-deletion-cancel
      path: /app/account-deletions/:requestId/cancel
      file: ./pages/account-deletion-cancel.vue
      visibility: public
      middleware: []
    - name: app-feature-slot
      path: /app/:featurePath(.*)*
      file: ./pages/feature-slot.vue
      visibility: private
      middleware: [app-session]
  layouts:
    - name: app-shell
      file: ./layouts/app-shell.vue
  components:
    - ./components
  plugins:
    - ./runtime.ts
  middleware:
    - name: app-session
      file: ./middleware/app-session.ts
