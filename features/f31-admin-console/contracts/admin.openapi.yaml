openapi: 3.1.0
info:
  title: Postqron private administration console
  version: 0.3.0
  description: |
    Private-channel contract. Every operation requires a verified, active,
    server-allowlisted administrator session and must never be mounted on the
    public API mux. Projections intentionally exclude credentials, OAuth
    tokens, password hashes, payment data, and hidden audit payloads.
servers:
  - url: https://admin.internal
security:
  - productSession: []
paths:
  /api/v1/admin/session:
    get:
      operationId: resolveAdminSession
      responses:
        "200":
          description: Verified and server-allowlisted administrator session.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/dashboard:
    get:
      operationId: getAdminDashboard
      description: >-
        Every service status reflects a real signal collected on this call.
        A dependency that could not be checked, or whose check has expired
        past its freshness window, is reported unknown; it is never reported
        operational. When the database itself is unreachable the response
        still returns 200 with database/api reflecting the outage and the
        worker/scheduler dependencies reported unknown, instead of failing
        the whole request.
      security:
        - productSession: []
      responses:
        "200":
          description: Minimal service health, entitlement, and recent audit projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: >-
            The administration data source itself could not be read (not to
            be confused with a degraded/outage service reported inside a
            successful 200 response).
  /api/v1/admin/search:
    get:
      operationId: searchAdminSubjects
      deprecated: true
      description: Retained for entitlement workflows; directory pages use paginated endpoints.
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Minimal user and workspace results without secrets or payment data.
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/plans:
    get:
      operationId: listAdminPlans
      description: Returns workspace entitlements with real usage and remaining capacity.
      parameters:
        - $ref: "#/components/parameters/Plan"
        - $ref: "#/components/parameters/BillingStatus"
        - $ref: "#/components/parameters/PlanType"
        - $ref: "#/components/parameters/WorkspaceOwner"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/PlanSort"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Filtered plan page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanList"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/plans/export:
    get:
      operationId: exportAdminPlans
      description: >
        Exports the complete filtered result with an allowlisted column set,
        formula injection mitigation, and a hard 10,000-row limit.
      parameters:
        - $ref: "#/components/parameters/ExportFormat"
        - $ref: "#/components/parameters/Plan"
        - $ref: "#/components/parameters/BillingStatus"
        - $ref: "#/components/parameters/PlanType"
        - $ref: "#/components/parameters/WorkspaceOwner"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/PlanSort"
        - $ref: "#/components/parameters/Direction"
      responses:
        "200":
          $ref: "#/components/responses/TabularExport"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/ExportLimit"
  /api/v1/admin/audit:
    get:
      operationId: listAdminAudit
      description: Reads the immutable, allowlisted audit projection.
      parameters:
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditSubject"
        - $ref: "#/components/parameters/AuditOutcome"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/AuditSort"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Filtered audit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/audit/export:
    get:
      operationId: exportAdminAudit
      description: >
        Exports the complete filtered immutable projection with formula
        injection mitigation and a hard 10,000-row limit.
      parameters:
        - $ref: "#/components/parameters/ExportFormat"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditSubject"
        - $ref: "#/components/parameters/AuditOutcome"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/AuditSort"
        - $ref: "#/components/parameters/Direction"
      responses:
        "200":
          $ref: "#/components/responses/TabularExport"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/ExportLimit"
  /api/v1/admin/audit/{event_id}:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: getAdminAuditEvent
      responses:
        "200":
          description: Audit event without hidden payloads or secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      description: Lists matching safe account projections with server-side pagination.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, locked]
        - name: email_verified
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Plan"
        - name: login_method
          in: query
          schema:
            type: string
            enum: [password, google, apple, facebook, linkedin]
        - $ref: "#/components/parameters/RegisteredFrom"
        - $ref: "#/components/parameters/RegisteredTo"
        - $ref: "#/components/parameters/LastLoginFrom"
        - $ref: "#/components/parameters/LastLoginTo"
        - name: sort
          in: query
          schema:
            type: string
            enum: [email, display_name, status, registered_at, last_login_at]
        - $ref: "#/components/parameters/Direction"
      responses:
        "200":
          description: Filtered user directory page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDirectoryPage"
        "400":
          $ref: "#/components/responses/InvalidFilters"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/users/{account_id}:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    get:
      operationId: getAdminUser
      responses:
        "200":
          description: Safe user drill-down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDirectoryItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/users/export:
    get:
      operationId: exportAdminUsers
      description: Exports the complete safe filtered user directory up to 10,000 rows.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Plan"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/ExportFormat"
      responses:
        "200":
          $ref: "#/components/responses/DirectoryExport"
        "400":
          $ref: "#/components/responses/InvalidFilters"
        "413":
          $ref: "#/components/responses/ExportTooLarge"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/workspaces:
    get:
      operationId: listAdminWorkspaces
      description: Lists matching safe workspace projections with server-side pagination.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Plan"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, deletion_pending]
        - name: owner
          in: query
          schema:
            type: string
            maxLength: 120
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
        - $ref: "#/components/parameters/UpdatedFrom"
        - $ref: "#/components/parameters/UpdatedTo"
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, owner, status, plan, created_at, updated_at]
        - $ref: "#/components/parameters/Direction"
      responses:
        "200":
          description: Filtered workspace directory page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDirectoryPage"
        "400":
          $ref: "#/components/responses/InvalidFilters"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/workspaces/export:
    get:
      operationId: exportAdminWorkspaces
      description: Exports the complete safe filtered workspace directory up to 10,000 rows.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Plan"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/ExportFormat"
      responses:
        "200":
          $ref: "#/components/responses/DirectoryExport"
        "400":
          $ref: "#/components/responses/InvalidFilters"
        "413":
          $ref: "#/components/responses/ExportTooLarge"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/workspaces/{workspace_id}/internal-plan:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    put:
      operationId: assignAdminInternalPlan
      security:
        - productSession: []
          csrfToken: []
          recentReauth: []
          idempotencyKey: []
      requestBody:
        $ref: "#/components/requestBodies/ConfirmedReason"
      responses:
        "200":
          description: F11 assignment accepted and immutably audited.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: revokeAdminInternalPlan
      security:
        - productSession: []
          csrfToken: []
          recentReauth: []
          idempotencyKey: []
      requestBody:
        $ref: "#/components/requestBodies/ConfirmedReason"
      responses:
        "200":
          description: F11 revocation accepted and immutably audited.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/admins/{account_id}:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    put:
      operationId: addConfiguredAdministrator
      security:
        - productSession: []
          csrfToken: []
          recentReauth: []
          idempotencyKey: []
      requestBody:
        $ref: "#/components/requestBodies/ConfirmedAdminReason"
      responses:
        "200":
          description: Administrator activation accepted and immutably audited.
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: removeConfiguredAdministrator
      security:
        - productSession: []
          csrfToken: []
          recentReauth: []
          idempotencyKey: []
      requestBody:
        $ref: "#/components/requestBodies/ConfirmedAdminReason"
      responses:
        "200":
          description: Administrator removal accepted and immutably audited.
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    productSession:
      type: apiKey
      in: cookie
      name: __Host-postqron_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    recentReauth:
      type: apiKey
      in: cookie
      name: __Host-postqron_session
      description: Server validates authenticated_at against the re-authentication window.
    idempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
  parameters:
    AccountID:
      name: account_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SafeID"
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SafeID"
    EventID:
      name: event_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SafeID"
    Search:
      name: q
      in: query
      description: Optional case-insensitive search; blank or at least two characters.
      schema:
        type: string
        maxLength: 120
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    Plan:
      name: plan
      in: query
      schema:
        type: string
        enum: [start, pro, team, internal]
    BillingStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [trialing, active, past_due, trial_expired, payment_restricted, canceled]
    PlanType:
      name: type
      in: query
      schema:
        type: string
        enum: [public, internal]
    WorkspaceOwner:
      name: q
      in: query
      schema:
        type: string
        maxLength: 120
    From:
      name: from
      in: query
      description: Inclusive UTC lower bound.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Inclusive UTC upper bound.
      schema:
        type: string
        format: date-time
    PlanSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [workspace, owner, plan, status, type, created_at, updated_at]
        default: updated_at
    AuditAction:
      name: action
      in: query
      schema:
        type: string
        maxLength: 128
    AuditActor:
      name: actor
      in: query
      schema:
        type: string
        maxLength: 128
    AuditSubject:
      name: subject
      in: query
      schema:
        type: string
        maxLength: 128
    AuditOutcome:
      name: outcome
      in: query
      schema:
        type: string
        maxLength: 64
    AuditSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [occurred_at, code, actor, subject, outcome]
        default: occurred_at
    ExportFormat:
      name: format
      in: query
      required: true
      schema:
        type: string
        enum: [csv, xlsx]
    RegisteredFrom:
      name: registered_from
      in: query
      schema:
        type: string
        format: date
    RegisteredTo:
      name: registered_to
      in: query
      description: Inclusive UTC calendar date.
      schema:
        type: string
        format: date
    LastLoginFrom:
      name: last_login_from
      in: query
      schema:
        type: string
        format: date
    LastLoginTo:
      name: last_login_to
      in: query
      description: Inclusive UTC calendar date.
      schema:
        type: string
        format: date
    CreatedFrom:
      name: created_from
      in: query
      schema:
        type: string
        format: date
    CreatedTo:
      name: created_to
      in: query
      description: Inclusive UTC calendar date.
      schema:
        type: string
        format: date
    UpdatedFrom:
      name: updated_from
      in: query
      schema:
        type: string
        format: date
    UpdatedTo:
      name: updated_to
      in: query
      description: Inclusive UTC calendar date.
      schema:
        type: string
        format: date
  schemas:
    SafeID:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          pattern: "^ADMIN_[A-Z_]+$"
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Usage:
      type: object
      additionalProperties: false
      required: [used, limit, remaining, unlimited]
      properties:
        used:
          type: integer
          minimum: 0
        limit:
          type: [integer, "null"]
          minimum: 0
        remaining:
          type: [integer, "null"]
          minimum: 0
        unlimited:
          type: boolean
    PlanRow:
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - workspace_name
        - owner_email
        - plan_code
        - status
        - internal
        - usage
        - workspace_created_at
        - plan_updated_at
        - period_start
        - period_end
        - internal_assigned_at
      properties:
        workspace_id:
          $ref: "#/components/schemas/SafeID"
        workspace_name:
          type: string
        owner_email:
          type: string
          format: email
        plan_code:
          type: string
          enum: [start, pro, team]
        status:
          type: string
        internal:
          type: boolean
        usage:
          type: object
          required: [members, channels, scheduled_publications]
          properties:
            members:
              $ref: "#/components/schemas/Usage"
            channels:
              $ref: "#/components/schemas/Usage"
            scheduled_publications:
              $ref: "#/components/schemas/Usage"
        workspace_created_at:
          type: string
          format: date-time
        plan_updated_at:
          type: string
          format: date-time
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        internal_assigned_at:
          type: [string, "null"]
          format: date-time
    PlanList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PlanRow"
        pagination:
          $ref: "#/components/schemas/PageInfo"
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, code, actor_id, subject_id, outcome, reason, correlation_id, occurred_at]
      properties:
        id:
          $ref: "#/components/schemas/SafeID"
        code:
          type: string
        actor_id:
          $ref: "#/components/schemas/SafeID"
        subject_id:
          $ref: "#/components/schemas/SafeID"
        outcome:
          type: string
        reason:
          type: string
          maxLength: 500
        correlation_id:
          $ref: "#/components/schemas/SafeID"
        occurred_at:
          type: string
          format: date-time
    AuditList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AuditEvent"
        pagination:
          $ref: "#/components/schemas/PageInfo"
    UserWorkspaceMembership:
      type: object
      additionalProperties: false
      required: [id, name, role, plan_code, plan_status]
      properties:
        id:
          $ref: "#/components/schemas/SafeID"
        name:
          type: string
        role:
          type: string
          enum: [owner, member]
        plan_code:
          type: string
          enum: [start, pro, team, internal, unassigned]
        plan_status:
          type: string
    UserDirectoryItem:
      type: object
      additionalProperties: false
      required: [id, email, display_name, account_status, email_verified, login_methods, registered_at, last_login_at, active_sessions, workspaces]
      properties:
        id:
          $ref: "#/components/schemas/SafeID"
        email:
          type: string
          format: email
        display_name:
          type: string
        account_status:
          type: string
          enum: [active, locked]
        email_verified:
          type: boolean
        login_methods:
          type: array
          uniqueItems: true
          items:
            type: string
        registered_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
        active_sessions:
          type: integer
          minimum: 0
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/UserWorkspaceMembership"
    UserDirectoryPage:
      allOf:
        - $ref: "#/components/schemas/DirectoryPage"
        - type: object
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/UserDirectoryItem"
    WorkspaceDirectoryItem:
      type: object
      additionalProperties: false
      required: [id, name, owner_id, owner_email, owner_display_name, status, plan_code, plan_status, member_count, channel_count, post_count, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/SafeID"
        name:
          type: string
        owner_id:
          $ref: "#/components/schemas/SafeID"
        owner_email:
          type: string
          format: email
        owner_display_name:
          type: string
        status:
          type: string
        plan_code:
          type: string
        plan_status:
          type: string
        member_count:
          type: integer
          minimum: 0
        channel_count:
          type: integer
          minimum: 0
        post_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceDirectoryPage:
      allOf:
        - $ref: "#/components/schemas/DirectoryPage"
        - type: object
          properties:
            items:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/WorkspaceDirectoryItem"
    DirectoryPage:
      type: object
      required: [items, page, page_size, total, sort, direction]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          enum: [10, 25, 50, 100]
        total:
          type: integer
          minimum: 0
        sort:
          type: string
        direction:
          type: string
          enum: [asc, desc]
    ServiceHealth:
      type: object
      additionalProperties: false
      required: [code, status, checked_at]
      properties:
        code:
          type: string
          description: >-
            One of api, database, worker_queue, scheduler_publishing, or an
            additional configured operational dependency.
        status:
          enum: [operational, degraded, outage, unknown]
          description: >-
            unknown means the dependency was never checked, or its check
            has expired past the server's freshness window. It is distinct
            from — and never rendered as — operational.
        checked_at:
          type: string
          format: date-time
          description: Timestamp of the last real check for this service.
    AdminDashboard:
      type: object
      additionalProperties: false
      required: [services, entitlements, recent_audit]
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceHealth'
        entitlements:
          type: array
          items:
            type: object
        recent_audit:
          type: array
          items:
            type: object
  responses:
    Unauthenticated:
      description: Session is missing or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Administration is forbidden without disclosing protected data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidFilter:
      description: A Plans/Audit filter, range, ordering, or page is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidFilters:
      description: A directory filter, date range, ordering, page, or page size is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: Confirmation, reason, identifier, or idempotency key is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested safe projection no longer exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Protected administration storage is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ExportLimit:
      description: More than 10,000 rows matched; narrow the filters and retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ExportTooLarge:
      description: More than 10,000 rows matched; narrow the filters and retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TabularExport:
      description: Filtered CSV or XLSX export with formula injection mitigation.
      content:
        text/csv:
          schema:
            type: string
            contentEncoding: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            contentEncoding: binary
    DirectoryExport:
      description: Filtered export with safe fields and attachment filename.
      content:
        text/csv:
          schema:
            type: string
            contentEncoding: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            contentEncoding: binary
  requestBodies:
    ConfirmedReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [confirmed, reason]
            properties:
              confirmed:
                const: true
              reason:
                type: string
                minLength: 8
                maxLength: 500
    ConfirmedAdminReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [confirmed, email, reason]
            properties:
              confirmed:
                const: true
              email:
                type: string
                format: email
              reason:
                type: string
                minLength: 8
                maxLength: 500
