openapi: 3.1.0
info:
  title: Postqron private administration console
  version: 0.2.0
  description: >
    Private-channel contract. Every operation requires a verified, active,
    server-allowlisted administrator and must never be mounted on the public
    API mux. List exports contain at most 10,000 filtered rows.
servers:
  - url: https://admin.internal
security:
  - productSession: []
paths:
  /api/v1/admin/session:
    get:
      operationId: resolveAdminSession
      responses:
        "200":
          description: Verified and server-allowlisted administrator session.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/dashboard:
    get:
      operationId: getAdminDashboard
      responses:
        "200":
          description: Service health and top-level dashboard projection.
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/search:
    get:
      operationId: searchAdminSubjects
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
      responses:
        "200":
          description: Minimal user and workspace results without secrets.
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/plans:
    get:
      operationId: listAdminPlans
      description: >
        Returns workspace entitlements with real usage and remaining capacity.
        Filtering, ordering, and pagination are applied server-side.
      parameters:
        - $ref: "#/components/parameters/Plan"
        - $ref: "#/components/parameters/BillingStatus"
        - $ref: "#/components/parameters/PlanType"
        - $ref: "#/components/parameters/WorkspaceOwner"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/PlanSort"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Filtered plan page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanList"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/plans/export:
    get:
      operationId: exportAdminPlans
      description: >
        Exports the complete filtered result. Fields are allowlisted and
        spreadsheet formula injection is neutralized. The hard limit is
        10,000 rows.
      parameters:
        - $ref: "#/components/parameters/ExportFormat"
        - $ref: "#/components/parameters/Plan"
        - $ref: "#/components/parameters/BillingStatus"
        - $ref: "#/components/parameters/PlanType"
        - $ref: "#/components/parameters/WorkspaceOwner"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/PlanSort"
        - $ref: "#/components/parameters/Direction"
      responses:
        "200":
          $ref: "#/components/responses/TabularExport"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/ExportLimit"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/audit:
    get:
      operationId: listAdminAudit
      description: >
        Reads the immutable audit projection. No secret or sensitive payload
        column is selected.
      parameters:
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditSubject"
        - $ref: "#/components/parameters/AuditOutcome"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/AuditSort"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Filtered audit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/audit/export:
    get:
      operationId: exportAdminAudit
      description: >
        Exports the complete filtered immutable projection with formula
        injection mitigation and a hard 10,000-row limit.
      parameters:
        - $ref: "#/components/parameters/ExportFormat"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditSubject"
        - $ref: "#/components/parameters/AuditOutcome"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/AuditSort"
        - $ref: "#/components/parameters/Direction"
      responses:
        "200":
          $ref: "#/components/responses/TabularExport"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/ExportLimit"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/audit/{event_id}:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: getAdminAuditEvent
      description: Safe drill-down containing only the immutable public audit projection.
      responses:
        "200":
          description: Audit event without hidden payloads or secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Audit event not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/workspaces/{workspace_id}/internal-plan:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    put:
      operationId: assignAdminInternalPlan
      security:
        - productSession: []
          csrfToken: []
          recentReauth: []
          idempotencyKey: []
      requestBody:
        $ref: "#/components/requestBodies/ConfirmedReason"
      responses:
        "200":
          description: F11 assignment accepted and immutably audited.
        "400":
          description: Confirmation, reason, identifier, or idempotency key is invalid.
        "401":
          description: Recent re-authentication is required.
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: revokeAdminInternalPlan
      security:
        - productSession: []
          csrfToken: []
          recentReauth: []
          idempotencyKey: []
      requestBody:
        $ref: "#/components/requestBodies/ConfirmedReason"
      responses:
        "200":
          description: F11 revocation accepted and immutably audited.
        "400":
          description: Confirmation, reason, identifier, or idempotency key is invalid.
        "401":
          description: Recent re-authentication is required.
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/admins/{account_id}:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    put:
      operationId: addConfiguredAdministrator
      description: The target email must also be present in the server allowlist.
      security:
        - productSession: []
          csrfToken: []
          recentReauth: []
          idempotencyKey: []
      requestBody:
        $ref: "#/components/requestBodies/ConfirmedAdminReason"
      responses:
        "200":
          description: Administrator activation accepted and immutably audited.
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: removeConfiguredAdministrator
      security:
        - productSession: []
          csrfToken: []
          recentReauth: []
          idempotencyKey: []
      requestBody:
        $ref: "#/components/requestBodies/ConfirmedAdminReason"
      responses:
        "200":
          description: Administrator removal accepted and immutably audited.
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    productSession:
      type: apiKey
      in: cookie
      name: __Host-postqron_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    recentReauth:
      type: apiKey
      in: cookie
      name: __Host-postqron_session
      description: The server validates authenticated_at against the re-authentication window.
    idempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    From:
      name: from
      in: query
      description: Inclusive UTC lower bound.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Inclusive UTC upper bound.
      schema:
        type: string
        format: date-time
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    Plan:
      name: plan
      in: query
      schema:
        type: string
        enum: [start, pro, team]
    BillingStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [trialing, active, past_due, trial_expired, payment_restricted, canceled]
    PlanType:
      name: type
      in: query
      schema:
        type: string
        enum: [public, internal]
    WorkspaceOwner:
      name: q
      in: query
      description: Case-insensitive workspace name, workspace ID, or owner email fragment.
      schema:
        type: string
        maxLength: 120
    PlanSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [workspace, owner, plan, status, type, created_at, updated_at]
        default: updated_at
    AuditAction:
      name: action
      in: query
      schema:
        type: string
        maxLength: 128
    AuditActor:
      name: actor
      in: query
      schema:
        type: string
        maxLength: 128
    AuditSubject:
      name: subject
      in: query
      schema:
        type: string
        maxLength: 128
    AuditOutcome:
      name: outcome
      in: query
      schema:
        type: string
        maxLength: 64
    AuditSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [occurred_at, code, actor, subject, outcome]
        default: occurred_at
    ExportFormat:
      name: format
      in: query
      required: true
      schema:
        type: string
        enum: [csv, xlsx]
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SafeID"
    EventID:
      name: event_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SafeID"
    AccountID:
      name: account_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SafeID"
  schemas:
    SafeID:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          pattern: "^ADMIN_[A-Z_]+$"
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Usage:
      type: object
      additionalProperties: false
      required: [used, limit, remaining, unlimited]
      properties:
        used:
          type: integer
          minimum: 0
        limit:
          type: [integer, "null"]
          minimum: 0
        remaining:
          type: [integer, "null"]
          minimum: 0
        unlimited:
          type: boolean
    PlanRow:
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - workspace_name
        - owner_email
        - plan_code
        - status
        - internal
        - usage
        - workspace_created_at
        - plan_updated_at
        - period_start
        - period_end
        - internal_assigned_at
      properties:
        workspace_id:
          $ref: "#/components/schemas/SafeID"
        workspace_name:
          type: string
        owner_email:
          type: string
          format: email
        plan_code:
          type: string
          enum: [start, pro, team]
        status:
          type: string
          enum: [trialing, active, past_due, trial_expired, payment_restricted, canceled]
        internal:
          type: boolean
        usage:
          type: object
          additionalProperties: false
          required: [members, channels, scheduled_publications]
          properties:
            members:
              $ref: "#/components/schemas/Usage"
            channels:
              $ref: "#/components/schemas/Usage"
            scheduled_publications:
              $ref: "#/components/schemas/Usage"
        workspace_created_at:
          type: string
          format: date-time
        plan_updated_at:
          type: string
          format: date-time
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        internal_assigned_at:
          type: [string, "null"]
          format: date-time
    PlanList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PlanRow"
        pagination:
          $ref: "#/components/schemas/PageInfo"
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, code, actor_id, subject_id, outcome, reason, correlation_id, occurred_at]
      properties:
        id:
          $ref: "#/components/schemas/SafeID"
        code:
          type: string
          maxLength: 128
        actor_id:
          $ref: "#/components/schemas/SafeID"
        subject_id:
          $ref: "#/components/schemas/SafeID"
        outcome:
          type: string
          maxLength: 64
        reason:
          type: string
          maxLength: 500
        correlation_id:
          $ref: "#/components/schemas/SafeID"
        occurred_at:
          type: string
          format: date-time
    AuditList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AuditEvent"
        pagination:
          $ref: "#/components/schemas/PageInfo"
  requestBodies:
    ConfirmedReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [confirmed, reason]
            properties:
              confirmed:
                const: true
              reason:
                type: string
                minLength: 8
                maxLength: 500
    ConfirmedAdminReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [confirmed, email, reason]
            properties:
              confirmed:
                const: true
              email:
                type: string
                format: email
              reason:
                type: string
                minLength: 8
                maxLength: 500
  responses:
    Unauthorized:
      description: Session is missing, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authorization failed without disclosing allowlist details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidFilter:
      description: Filter, order, pagination, range, or export format is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ExportLimit:
      description: The filtered result exceeds the explicit 10,000-row export limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Administration data is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TabularExport:
      description: Formula-safe CSV or XLSX attachment with allowlisted columns.
      headers:
        Content-Disposition:
          schema:
            type: string
      content:
        text/csv:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
