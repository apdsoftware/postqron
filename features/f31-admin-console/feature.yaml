schema_version: 1
id: admin-console
kind: web
version: 0.1.0
entrypoints:
  server: ./module.go
  web: ./runtime.ts
dependencies:
  - app-shell
  - auth
  - f10-entitlements
  - f11-internal-plan
  - i18n
  - operations
  - workspaces
migrations:
  - ./migrations/000001_create_admin_console.sql
server:
  routes:
    - path: /admin/session
      handler: Admin
      methods: [GET]
      visibility: private
    - path: /admin/dashboard
      handler: Admin
      methods: [GET]
      visibility: private
    - path: /admin/search
      handler: Admin
      methods: [GET]
      visibility: private
    - path: /admin/workspaces/{workspace_id}/internal-plan
      handler: Admin
      methods: [PUT, DELETE]
      visibility: private
    - path: /admin/admins/{account_id}
      handler: Admin
      methods: [PUT, DELETE]
      visibility: private
web:
  routes:
    - name: admin-console
      path: /admin
      file: ./pages/admin.vue
      visibility: private
      middleware: [admin-access]
  layouts:
    - name: admin-console
      file: ./layouts/admin-console.vue
  components: []
  plugins:
    - ./runtime.ts
  middleware:
    - name: admin-access
      file: ./middleware/admin-access.ts
