schema_version: 1
id: admin-console
kind: web
version: 0.2.0
entrypoints:
  server: ./module.go
  web: ./runtime.ts
dependencies:
  - app-shell
  - auth
  - f10-entitlements
  - f11-internal-plan
  - i18n
  - operations
  - publishing
  - scheduling
  - social-connections
  - workspaces
migrations:
  - ./migrations/000001_create_admin_console.sql
server:
  # Data routes keep visibility: private; only session GET and preflights bypass global auth.
  routes:
    - path: /admin/session
      handler: Admin
      methods: [GET]
      visibility: "public"
    - path: /admin/session
      handler: Admin
      methods: [OPTIONS]
      visibility: "public"
    - path: /admin/dashboard
      handler: Admin
      methods: [GET]
      visibility: private
    - path: /admin/dashboard
      handler: Admin
      methods: [OPTIONS]
      visibility: "public"
    - path: /admin/search
      handler: Admin
      methods: [GET]
      visibility: private
    - path: /admin/search
      handler: Admin
      methods: [OPTIONS]
      visibility: "public"
    - path: /admin/users
      handler: Admin
      methods: [GET]
      visibility: private
    - path: /admin/users
      handler: Admin
      methods: [OPTIONS]
      visibility: "public"
    - path: /admin/users/export
      handler: Admin
      methods: [GET]
      visibility: private
    - path: /admin/users/export
      handler: Admin
      methods: [OPTIONS]
      visibility: "public"
    - path: /admin/users/{account_id}
      handler: Admin
      methods: [GET]
      visibility: private
    - path: /admin/users/{account_id}
      handler: Admin
      methods: [OPTIONS]
      visibility: "public"
    - path: /admin/workspaces
      handler: Admin
      methods: [GET]
      visibility: private
    - path: /admin/workspaces
      handler: Admin
      methods: [OPTIONS]
      visibility: "public"
    - path: /admin/workspaces/export
      handler: Admin
      methods: [GET]
      visibility: private
    - path: /admin/workspaces/export
      handler: Admin
      methods: [OPTIONS]
      visibility: "public"
    - path: /admin/workspaces/{workspace_id}/internal-plan
      handler: Admin
      methods: [PUT, DELETE]
      visibility: private
    - path: /admin/workspaces/{workspace_id}/internal-plan
      handler: Admin
      methods: [OPTIONS]
      visibility: "public"
    - path: /admin/admins/{account_id}
      handler: Admin
      methods: [PUT, DELETE]
      visibility: private
    - path: /admin/admins/{account_id}
      handler: Admin
      methods: [OPTIONS]
      visibility: "public"
web:
  routes:
    - name: admin-console
      path: /admin
      file: ./pages/admin.vue
      visibility: private
      middleware: [admin-access]
    - name: admin-console-users
      path: /admin/users
      file: ./pages/admin-users.vue
      visibility: private
      middleware: [admin-access]
    - name: admin-console-workspaces
      path: /admin/workspaces
      file: ./pages/admin-workspaces.vue
      visibility: private
      middleware: [admin-access]
    - name: admin-console-plans
      path: /admin/plans
      file: ./pages/admin-plans.vue
      visibility: private
      middleware: [admin-access]
    - name: admin-console-audit
      path: /admin/audit
      file: ./pages/admin-audit.vue
      visibility: private
      middleware: [admin-access]
    - name: admin-console-profile
      path: /admin/profile
      file: ./pages/admin-profile.vue
      visibility: private
      middleware: [admin-access]
  layouts:
    - name: admin-console
      file: ./layouts/admin-console.vue
  components:
    - ./components
  plugins:
    - ./runtime.ts
  middleware:
    - name: admin-access
      file: ./middleware/admin-access.ts
