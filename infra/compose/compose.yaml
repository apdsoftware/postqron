name: postqron-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postqron
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postqron
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postqron -d postqron"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql
