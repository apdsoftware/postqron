name: postqron

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-off}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_config:/config
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: https://${API_DOMAIN}
      NUXT_API_BASE: http://api:8080
      PRELAUNCH_MODE: ${PRELAUNCH_MODE:?PRELAUNCH_MODE is required}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PRELAUNCH_MODE: ${PRELAUNCH_MODE:?PRELAUNCH_MODE is required}
      POSTQRON_ADMIN_BOOTSTRAP_EMAIL: ${POSTQRON_ADMIN_BOOTSTRAP_EMAIL:-}
      POSTQRON_ADMIN_PASSWORD_HASH_B64: ${POSTQRON_ADMIN_PASSWORD_HASH_B64:-}
      POSTQRON_ADMIN_ALLOWLIST: ${POSTQRON_ADMIN_ALLOWLIST:-carlo.zuffetti@apdsoftware.it}
      POSTQRON_ADMIN_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      POSTQRON_AUTH_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      POSTQRON_F05_ENABLED: ${POSTQRON_F05_ENABLED:-false}
      POSTQRON_F05_CIPHER_KEY_ID: ${POSTQRON_F05_CIPHER_KEY_ID:-}
      POSTQRON_F05_CIPHER_KEY_BASE64: ${POSTQRON_F05_CIPHER_KEY_BASE64:-}
      POSTQRON_F05_META_ENABLED: ${POSTQRON_F05_META_ENABLED:-false}
      POSTQRON_F05_META_GRAPH_VERSION: ${POSTQRON_F05_META_GRAPH_VERSION:-}
      POSTQRON_F05_FACEBOOK_CLIENT_ID: ${POSTQRON_F05_FACEBOOK_CLIENT_ID:-}
      POSTQRON_F05_FACEBOOK_CLIENT_SECRET: ${POSTQRON_F05_FACEBOOK_CLIENT_SECRET:-}
      POSTQRON_F05_FACEBOOK_REDIRECT_URL: ${POSTQRON_F05_FACEBOOK_REDIRECT_URL:-}
      POSTQRON_F05_FACEBOOK_LOGIN_CONFIG_ID: ${POSTQRON_F05_FACEBOOK_LOGIN_CONFIG_ID:-}
      POSTQRON_F05_FACEBOOK_APP_REVIEW_APPROVED: ${POSTQRON_F05_FACEBOOK_APP_REVIEW_APPROVED:-false}
      POSTQRON_F05_FACEBOOK_RUNTIME_AUDIT_VERIFIED: ${POSTQRON_F05_FACEBOOK_RUNTIME_AUDIT_VERIFIED:-false}
      POSTQRON_F05_INSTAGRAM_CLIENT_ID: ${POSTQRON_F05_INSTAGRAM_CLIENT_ID:-}
      POSTQRON_F05_INSTAGRAM_CLIENT_SECRET: ${POSTQRON_F05_INSTAGRAM_CLIENT_SECRET:-}
      POSTQRON_F05_INSTAGRAM_REDIRECT_URL: ${POSTQRON_F05_INSTAGRAM_REDIRECT_URL:-}
      POSTQRON_F05_INSTAGRAM_APP_REVIEW_APPROVED: ${POSTQRON_F05_INSTAGRAM_APP_REVIEW_APPROVED:-false}
      POSTQRON_F05_INSTAGRAM_RUNTIME_AUDIT_VERIFIED: ${POSTQRON_F05_INSTAGRAM_RUNTIME_AUDIT_VERIFIED:-false}
      POSTQRON_F05_THREADS_ENABLED: ${POSTQRON_F05_THREADS_ENABLED:-false}
      POSTQRON_F05_THREADS_CLIENT_ID: ${POSTQRON_F05_THREADS_CLIENT_ID:-}
      POSTQRON_F05_THREADS_CLIENT_SECRET: ${POSTQRON_F05_THREADS_CLIENT_SECRET:-}
      POSTQRON_F05_THREADS_REDIRECT_URL: ${POSTQRON_F05_THREADS_REDIRECT_URL:-}
      POSTQRON_F05_THREADS_APP_REVIEW_APPROVED: ${POSTQRON_F05_THREADS_APP_REVIEW_APPROVED:-false}
      POSTQRON_F05_THREADS_RUNTIME_AUDIT_VERIFIED: ${POSTQRON_F05_THREADS_RUNTIME_AUDIT_VERIFIED:-false}
      POSTQRON_F05_X_ENABLED: ${POSTQRON_F05_X_ENABLED:-false}
      POSTQRON_F05_X_CLIENT_ID: ${POSTQRON_F05_X_CLIENT_ID:-}
      POSTQRON_F05_X_CLIENT_SECRET: ${POSTQRON_F05_X_CLIENT_SECRET:-}
      POSTQRON_F05_X_REDIRECT_URL: ${POSTQRON_F05_X_REDIRECT_URL:-}
      POSTQRON_F05_X_API_ACCESS_APPROVED: ${POSTQRON_F05_X_API_ACCESS_APPROVED:-false}
      POSTQRON_F05_X_RUNTIME_AUDIT_VERIFIED: ${POSTQRON_F05_X_RUNTIME_AUDIT_VERIFIED:-false}
      POSTQRON_F05_X_SMOKE_TEST_VERIFIED: ${POSTQRON_F05_X_SMOKE_TEST_VERIFIED:-false}
      POSTQRON_F05_LINKEDIN_ENABLED: ${POSTQRON_F05_LINKEDIN_ENABLED:-false}
      POSTQRON_F05_LINKEDIN_CLIENT_ID: ${POSTQRON_F05_LINKEDIN_CLIENT_ID:-}
      POSTQRON_F05_LINKEDIN_CLIENT_SECRET: ${POSTQRON_F05_LINKEDIN_CLIENT_SECRET:-}
      POSTQRON_F05_LINKEDIN_REDIRECT_URL: ${POSTQRON_F05_LINKEDIN_REDIRECT_URL:-}
      POSTQRON_F05_LINKEDIN_API_VERSION: ${POSTQRON_F05_LINKEDIN_API_VERSION:-}
      POSTQRON_F05_LINKEDIN_REVIEW_APPROVED: ${POSTQRON_F05_LINKEDIN_REVIEW_APPROVED:-false}
      POSTQRON_F05_LINKEDIN_RUNTIME_AUDIT_VERIFIED: ${POSTQRON_F05_LINKEDIN_RUNTIME_AUDIT_VERIFIED:-false}
      POSTQRON_F05_LINKEDIN_SMOKE_VERIFIED: ${POSTQRON_F05_LINKEDIN_SMOKE_VERIFIED:-false}
      POSTQRON_F05_LINKEDIN_PROGRAMMATIC_REFRESH_APPROVED: ${POSTQRON_F05_LINKEDIN_PROGRAMMATIC_REFRESH_APPROVED:-false}
      POSTQRON_F05_PINTEREST_ENABLED: ${POSTQRON_F05_PINTEREST_ENABLED:-false}
      POSTQRON_F05_PINTEREST_CLIENT_ID: ${POSTQRON_F05_PINTEREST_CLIENT_ID:-}
      POSTQRON_F05_PINTEREST_CLIENT_SECRET: ${POSTQRON_F05_PINTEREST_CLIENT_SECRET:-}
      POSTQRON_F05_PINTEREST_REDIRECT_URL: ${POSTQRON_F05_PINTEREST_REDIRECT_URL:-}
      POSTQRON_F05_PINTEREST_ACCESS_APPROVED: ${POSTQRON_F05_PINTEREST_ACCESS_APPROVED:-false}
      POSTQRON_F05_PINTEREST_RUNTIME_AUDIT_VERIFIED: ${POSTQRON_F05_PINTEREST_RUNTIME_AUDIT_VERIFIED:-false}
      POSTQRON_F05_TIKTOK_ENABLED: ${POSTQRON_F05_TIKTOK_ENABLED:-false}
      POSTQRON_F05_TIKTOK_CLIENT_KEY: ${POSTQRON_F05_TIKTOK_CLIENT_KEY:-}
      POSTQRON_F05_TIKTOK_CLIENT_SECRET: ${POSTQRON_F05_TIKTOK_CLIENT_SECRET:-}
      POSTQRON_F05_TIKTOK_REDIRECT_URL: ${POSTQRON_F05_TIKTOK_REDIRECT_URL:-}
      POSTQRON_F05_TIKTOK_CONTENT_POSTING_REVIEW_APPROVED: ${POSTQRON_F05_TIKTOK_CONTENT_POSTING_REVIEW_APPROVED:-false}
      POSTQRON_F05_TIKTOK_CONTENT_POSTING_AUDIT_APPROVED: ${POSTQRON_F05_TIKTOK_CONTENT_POSTING_AUDIT_APPROVED:-false}
      POSTQRON_F05_TIKTOK_RUNTIME_SMOKE_VERIFIED: ${POSTQRON_F05_TIKTOK_RUNTIME_SMOKE_VERIFIED:-false}
      POSTQRON_F05_TIKTOK_QUOTA_ACCESS_CONFIRMED: ${POSTQRON_F05_TIKTOK_QUOTA_ACCESS_CONFIRMED:-false}
      POSTQRON_F05_YOUTUBE_ENABLED: ${POSTQRON_F05_YOUTUBE_ENABLED:-false}
      POSTQRON_F05_YOUTUBE_CLIENT_ID: ${POSTQRON_F05_YOUTUBE_CLIENT_ID:-}
      POSTQRON_F05_YOUTUBE_CLIENT_SECRET: ${POSTQRON_F05_YOUTUBE_CLIENT_SECRET:-}
      POSTQRON_F05_YOUTUBE_REDIRECT_URL: ${POSTQRON_F05_YOUTUBE_REDIRECT_URL:-}
      POSTQRON_F05_YOUTUBE_OAUTH_VERIFICATION_APPROVED: ${POSTQRON_F05_YOUTUBE_OAUTH_VERIFICATION_APPROVED:-false}
      POSTQRON_F05_YOUTUBE_API_AUDIT_APPROVED: ${POSTQRON_F05_YOUTUBE_API_AUDIT_APPROVED:-false}
      POSTQRON_F05_YOUTUBE_RUNTIME_SMOKE_VERIFIED: ${POSTQRON_F05_YOUTUBE_RUNTIME_SMOKE_VERIFIED:-false}
      POSTQRON_F05_YOUTUBE_QUOTA_ACCESS_CONFIRMED: ${POSTQRON_F05_YOUTUBE_QUOTA_ACCESS_CONFIRMED:-false}
      POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_ENABLED: ${POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_ENABLED:-false}
      POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_CLIENT_ID: ${POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_CLIENT_ID:-}
      POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET: ${POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET:-}
      POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_REDIRECT_URL: ${POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_REDIRECT_URL:-}
      POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_API_ACCESS_APPROVED: ${POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_API_ACCESS_APPROVED:-false}
      POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_OAUTH_REVIEW_APPROVED: ${POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_OAUTH_REVIEW_APPROVED:-false}
      POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_RUNTIME_AUDIT_VERIFIED: ${POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_RUNTIME_AUDIT_VERIFIED:-false}
      POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_SMOKE_VERIFIED: ${POSTQRON_F05_GOOGLE_BUSINESS_PROFILE_SMOKE_VERIFIED:-false}
      POSTQRON_F05_MASTODON_ENABLED: ${POSTQRON_F05_MASTODON_ENABLED:-false}
      POSTQRON_F05_MASTODON_REDIRECT_URL: ${POSTQRON_F05_MASTODON_REDIRECT_URL:-}
      POSTQRON_F05_MASTODON_RUNTIME_AUDIT_VERIFIED: ${POSTQRON_F05_MASTODON_RUNTIME_AUDIT_VERIFIED:-false}
      POSTQRON_F05_MASTODON_RUNTIME_SMOKE_VERIFIED: ${POSTQRON_F05_MASTODON_RUNTIME_SMOKE_VERIFIED:-false}
      POSTQRON_F05_MASTODON_COMPATIBILITY_VERSION: ${POSTQRON_F05_MASTODON_COMPATIBILITY_VERSION:-}
      POSTQRON_F05_BLUESKY_ENABLED: ${POSTQRON_F05_BLUESKY_ENABLED:-false}
      POSTQRON_F05_BLUESKY_CLIENT_ID: ${POSTQRON_F05_BLUESKY_CLIENT_ID:-}
      POSTQRON_F05_BLUESKY_REDIRECT_URL: ${POSTQRON_F05_BLUESKY_REDIRECT_URL:-}
      POSTQRON_F05_BLUESKY_RUNTIME_AUDIT_VERIFIED: ${POSTQRON_F05_BLUESKY_RUNTIME_AUDIT_VERIFIED:-false}
      POSTQRON_F05_BLUESKY_RUNTIME_SMOKE_VERIFIED: ${POSTQRON_F05_BLUESKY_RUNTIME_SMOKE_VERIFIED:-false}
      POSTQRON_F05_BLUESKY_COMPATIBILITY_VERSION: ${POSTQRON_F05_BLUESKY_COMPATIBILITY_VERSION:-}
      POSTQRON_F05_BLUESKY_PLC_DIRECTORY_ORIGIN: ${POSTQRON_F05_BLUESKY_PLC_DIRECTORY_ORIGIN:-}
      POSTQRON_PRIVACY_ARTIFACT_DIR: /var/lib/postqron/privacy-exports
      POSTQRON_PRIVACY_DOWNLOAD_BASE_URL: https://${API_DOMAIN}
      POSTQRON_PRIVACY_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      POSTQRON_PRIVACY_ARTIFACT_KEY_B64: ${POSTQRON_PRIVACY_ARTIFACT_KEY_B64:?POSTQRON_PRIVACY_ARTIFACT_KEY_B64 is required}
      POSTQRON_MAILRONIX_ENDPOINT: ${POSTQRON_MAILRONIX_ENDPOINT:?POSTQRON_MAILRONIX_ENDPOINT is required}
      POSTQRON_MAILRONIX_API_KEY_SECRET_NAME: ${POSTQRON_MAILRONIX_API_KEY_SECRET_NAME:?POSTQRON_MAILRONIX_API_KEY_SECRET_NAME is required}
      POSTQRON_MAILRONIX_SENDER_EMAIL: ${POSTQRON_MAILRONIX_SENDER_EMAIL:?POSTQRON_MAILRONIX_SENDER_EMAIL is required}
      POSTQRON_MAILRONIX_DOMAIN_VERIFIED: ${POSTQRON_MAILRONIX_DOMAIN_VERIFIED:?POSTQRON_MAILRONIX_DOMAIN_VERIFIED is required}
      MAILRONIX_TRANSACTIONAL_API_KEY: ${MAILRONIX_TRANSACTIONAL_API_KEY:?MAILRONIX_TRANSACTIONAL_API_KEY is required}
      POSTQRON_ENV: production
    volumes:
      - privacy_exports:/var/lib/postqron/privacy-exports
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      POSTQRON_PRIVACY_ARTIFACT_DIR: /var/lib/postqron/privacy-exports
      POSTQRON_PRIVACY_ARTIFACT_KEY_B64: ${POSTQRON_PRIVACY_ARTIFACT_KEY_B64:?POSTQRON_PRIVACY_ARTIFACT_KEY_B64 is required}
      POSTQRON_MAILRONIX_ENDPOINT: ${POSTQRON_MAILRONIX_ENDPOINT:?POSTQRON_MAILRONIX_ENDPOINT is required}
      POSTQRON_MAILRONIX_API_KEY_SECRET_NAME: ${POSTQRON_MAILRONIX_API_KEY_SECRET_NAME:?POSTQRON_MAILRONIX_API_KEY_SECRET_NAME is required}
      POSTQRON_MAILRONIX_SENDER_EMAIL: ${POSTQRON_MAILRONIX_SENDER_EMAIL:?POSTQRON_MAILRONIX_SENDER_EMAIL is required}
      POSTQRON_MAILRONIX_DOMAIN_VERIFIED: ${POSTQRON_MAILRONIX_DOMAIN_VERIFIED:?POSTQRON_MAILRONIX_DOMAIN_VERIFIED is required}
      MAILRONIX_TRANSACTIONAL_API_KEY: ${MAILRONIX_TRANSACTIONAL_API_KEY:?MAILRONIX_TRANSACTIONAL_API_KEY is required}
      POSTQRON_ENV: production
    volumes:
      - privacy_exports:/var/lib/postqron/privacy-exports
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    command: ["migrate"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postqron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-postqron}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postqron} -d ${POSTGRES_DB:-postqron}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  caddy_config:
  caddy_data:
  postgres_data:
  privacy_exports:
