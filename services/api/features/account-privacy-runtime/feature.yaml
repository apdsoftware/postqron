schema_version: 1
id: account-privacy-runtime
kind: api
version: 0.1.0
entrypoint: ./runtime.go
dependencies:
  - account-privacy
  - auth
  - workspaces
  - f10-entitlements
server:
  routes:
    - path: /account
      handler: AccountPrivacy
      methods: [GET]
      visibility: "private"
    - path: /account/profile
      handler: AccountPrivacy
      methods: [PATCH]
      visibility: "private"
    - path: /account/providers/{provider_id}
      handler: AccountPrivacy
      methods: [DELETE]
      visibility: "private"
    - path: /account/exports
      handler: AccountPrivacy
      methods: [POST]
      visibility: "private"
    - path: /account/exports/{export_id}/download
      handler: AccountPrivacy
      methods: [GET]
      visibility: "private"
    - path: /account/deletions
      handler: AccountPrivacy
      methods: [POST]
      visibility: "private"
    - path: /account/deletions/{request_id}
      handler: AccountPrivacy
      methods: [DELETE]
      visibility: "private"
