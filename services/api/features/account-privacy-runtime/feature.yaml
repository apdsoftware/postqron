schema_version: 1
id: account-privacy-runtime
kind: api
version: 0.1.0
entrypoint: ./runtime.go
dependencies:
  - account-privacy
  - auth
  - workspaces
  - f10-entitlements
migrations:
  - ./migrations/000001_privacy_runtime.sql
server:
  routes:
    - path: /account
      handler: AccountPrivacy
      methods: [GET]
      visibility: "private"
    - path: /account/profile
      handler: AccountPrivacy
      methods: [PATCH]
      visibility: "private"
    - path: /account/providers/{provider_id}
      handler: AccountPrivacy
      methods: [DELETE]
      visibility: "private"
    - path: /account/exports
      handler: AccountPrivacy
      methods: [POST]
      visibility: "private"
    - path: /account/exports/{export_id}/download
      handler: AccountPrivacy
      methods: [GET]
      visibility: "private"
    - path: /account/privacy-artifacts/{token}
      handler: AccountPrivacy
      methods: [GET]
      visibility: "public"
    - path: /account/deletions
      handler: AccountPrivacy
      methods: [POST]
      visibility: "private"
    - path: /account/deletion-cancel-capabilities
      handler: AccountPrivacy
      methods: [POST]
      visibility: "private"
    - path: /account/deletions/{request_id}/cancel
      handler: AccountPrivacy
      methods: [POST]
      visibility: "public"
    - path: /account/deletions/{request_id}
      handler: AccountPrivacy
      methods: [DELETE]
      visibility: "private"
