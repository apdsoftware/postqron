schema_version: 1
id: app-shell-api
kind: api
version: 0.1.0
entrypoint: ./runtime.go
dependencies:
  - app-shell
  - auth
  - workspaces
server:
  routes:
    - path: /app/bootstrap
      handler: App
      methods: [GET]
      visibility: "public"
    - path: /app/bootstrap
      handler: App
      methods: [OPTIONS]
      visibility: "public"
    - path: /app/session
      handler: App
      methods: [GET]
      visibility: "public"
    - path: /app/session
      handler: App
      methods: [OPTIONS]
      visibility: "public"
